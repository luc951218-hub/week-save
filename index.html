<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週週記｜預算管理</title>

<style>
:root {
    --primary: #007aff;
    --primary-light: #eaf4ff;
    --green: #34c759;
    --green-light: #e9f9ef;
    --red: #ff3b30;
    --red-light: #fff0ef;
    --orange: #ff9500;
    --orange-light: #fff5e6;
    --purple: #af52de;
    --purple-light: #f7edfc;

    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #6e6e73;
    --border: #e5e5ea;

    --shadow: 0 4px 18px rgba(0,0,0,.06);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1180px;
    margin: auto;
    padding: 24px;
}

/* =========================
   Header
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo-area h1 {
    margin: 0;
    font-size: 28px;
}

.logo-area p {
    margin: 5px 0 0;
    color: var(--sub);
    font-size: 14px;
}

.month-selector {
    display: flex;
    align-items: center;
    gap: 8px;
}

.month-selector button {
    width: 36px;
    height: 36px;
    border: none;
    background: white;
    border-radius: 50%;
    box-shadow: var(--shadow);
    font-size: 18px;
}

.month-selector strong {
    min-width: 90px;
    text-align: center;
}

/* =========================
   Cards
========================= */

.card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 18px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.section-title h2 {
    font-size: 18px;
    margin: 0;
}

.section-title span {
    font-size: 13px;
    color: var(--sub);
}

/* =========================
   Budget Hero
========================= */

.budget-hero {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
    background: linear-gradient(135deg, #ffffff, #f4f9ff);
}

.total-budget {
    display: flex;
    align-items: center;
    gap: 24px;
}

.budget-circle {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background:
        conic-gradient(
            var(--primary) var(--percent, 0%),
            #e9edf2 var(--percent, 0%)
        );
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
}

.budget-circle::after {
    content: "";
    position: absolute;
    width: 112px;
    height: 112px;
    background: white;
    border-radius: 50%;
}

.circle-content {
    position: relative;
    z-index: 1;
    text-align: center;
}

.circle-content strong {
    display: block;
    font-size: 24px;
}

.circle-content small {
    color: var(--sub);
}

.budget-info h3 {
    margin: 0 0 5px;
    color: var(--sub);
    font-size: 14px;
}

.budget-info .amount {
    font-size: 32px;
    font-weight: 800;
}

.fixed-label {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #f1f1f3;
    color: var(--sub);
    font-size: 12px;
}

.budget-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.stat-box {
    background: #f7f7f9;
    border-radius: 14px;
    padding: 15px;
}

.stat-box .label {
    color: var(--sub);
    font-size: 12px;
}

.stat-box strong {
    display: block;
    margin-top: 5px;
    font-size: 21px;
}

.stat-box.green strong {
    color: var(--green);
}

.stat-box.red strong {
    color: var(--red);
}

.stat-box.orange strong {
    color: var(--orange);
}

/* =========================
   Weekly
========================= */

.week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
}

.week-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    background: #fff;
    position: relative;
}

.week-card.current {
    border: 2px solid var(--primary);
    background: #fbfdff;
}

.week-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.week-number {
    font-weight: 700;
}

.current-badge {
    background: var(--primary);
    color: white;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 10px;
}

.week-date {
    font-size: 12px;
    color: var(--sub);
    margin-top: 4px;
}

.week-amount {
    margin-top: 15px;
}

.week-amount strong {
    font-size: 25px;
}

.week-amount span {
    color: var(--sub);
    font-size: 12px;
}

.progress {
    height: 8px;
    background: #e9e9ed;
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-fill {
    height: 100%;
    border-radius: 10px;
    transition: width .3s;
}

.progress-blue {
    background: var(--primary);
}

.progress-green {
    background: var(--green);
}

.progress-red {
    background: var(--red);
}

.week-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
}

.remaining {
    color: var(--green);
    font-weight: 700;
}

.remaining.over {
    color: var(--red);
}

/* =========================
   Today
========================= */

.today-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.today-box {
    padding: 18px;
    border-radius: 16px;
    background: #f7f8fa;
}

.today-box.blue {
    background: var(--primary-light);
}

.today-box.green {
    background: var(--green-light);
}

.today-box.orange {
    background: var(--orange-light);
}

.today-box.red {
    background: var(--red-light);
}

.today-box .emoji {
    font-size: 25px;
}

.today-box .label {
    color: var(--sub);
    font-size: 13px;
    margin-top: 8px;
}

.today-box strong {
    display: block;
    font-size: 27px;
    margin-top: 3px;
}

/* =========================
   Calendar
========================= */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.calendar-weekday {
    text-align: center;
    color: var(--sub);
    font-size: 12px;
    padding: 5px;
}

.day {
    min-height: 88px;
    background: #fafafa;
    border: 1px solid #eeeeF2;
    border-radius: 12px;
    padding: 8px;
    position: relative;
    cursor: pointer;
}

.day:hover {
    border-color: var(--primary);
}

.day.empty {
    background: transparent;
    border: none;
    cursor: default;
}

.day.today {
    border: 2px solid var(--primary);
}

.day-number {
    font-size: 13px;
    font-weight: 700;
}

.day-budget {
    font-size: 10px;
    color: var(--sub);
    margin-top: 6px;
}

.day-spent {
    font-size: 11px;
    font-weight: 700;
    margin-top: 3px;
}

.day-future {
    margin-top: 3px;
    color: var(--orange);
    font-size: 9px;
}

.day-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
}

/* =========================
   Future Expenses
========================= */

.future-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.future-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
}

.future-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.future-name {
    font-size: 16px;
    font-weight: 700;
}

.future-date {
    color: var(--sub);
    font-size: 12px;
    margin-top: 3px;
}

.future-total {
    font-size: 20px;
    font-weight: 800;
}

.future-progress {
    margin-top: 12px;
}

.future-detail {
    display: none;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

.future-detail.open {
    display: block;
}

.detail-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #f0f0f2;
}

.detail-item:last-child {
    border-bottom: none;
}

.detail-name {
    font-size: 13px;
}

.detail-price {
    font-weight: 700;
}

.future-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

/* =========================
   Savings
========================= */

.savings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
}

.saving-card {
    background: linear-gradient(135deg, #fff, #faf5ff);
    border: 1px solid #eadcf4;
    border-radius: 16px;
    padding: 16px;
}

.saving-header {
    display: flex;
    justify-content: space-between;
}

.saving-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--purple-light);
    font-size: 21px;
}

.saving-title {
    font-weight: 700;
}

.saving-target {
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
}

.saving-amount {
    margin-top: 18px;
    font-size: 24px;
    font-weight: 800;
}

.saving-gap {
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
}

/* =========================
   Buttons
========================= */

.btn {
    border: none;
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-light {
    background: #f1f1f3;
    color: var(--text);
}

.btn-green {
    background: var(--green);
    color: white;
}

.btn-danger {
    background: var(--red-light);
    color: var(--red);
}

.add-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 23px;
}

/* =========================
   Modal
========================= */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    background: white;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 22px;
    padding: 22px;
}

.modal h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 6px;
}

.form-group input,
.form-group select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
}

/* =========================
   Detail Editor
========================= */

.detail-editor {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 12px;
    margin-bottom: 10px;
}

.detail-editor-row {
    display: grid;
    grid-template-columns: 1fr 100px 35px;
    gap: 7px;
}

.remove-detail {
    border: none;
    border-radius: 9px;
    background: var(--red-light);
    color: var(--red);
}

/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    color: var(--sub);
    padding: 30px 10px;
    font-size: 13px;
}

/* =========================
   Responsive
========================= */

@media (max-width: 760px) {

    .app {
        padding: 14px;
    }

    .header {
        align-items: flex-start;
    }

    .budget-hero {
        grid-template-columns: 1fr;
    }

    .total-budget {
        flex-direction: column;
        align-items: flex-start;
    }

    .today-grid {
        grid-template-columns: 1fr 1fr;
    }

    .calendar {
        gap: 3px;
    }

    .day {
        min-height: 70px;
        padding: 5px;
    }

    .day-budget {
        font-size: 8px;
    }

    .day-spent {
        font-size: 9px;
    }

    .week-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <h1>週週記</h1>
            <p>讓每一週都知道自己還能花多少</p>
        </div>

        <div class="month-selector">
            <button onclick="changeMonth(-1)">‹</button>
            <strong id="monthTitle"></strong>
            <button onclick="changeMonth(1)">›</button>
        </div>
    </div>

    <!-- 固定預算 -->
    <div class="card budget-hero">

        <div class="total-budget">

            <div class="budget-circle" id="budgetCircle">
                <div class="circle-content">
                    <strong id="remainingPercent">100%</strong>
                    <small>剩餘</small>
                </div>
            </div>

            <div class="budget-info">
                <h3>本月固定預算</h3>
                <div class="amount">$15,000</div>
                <div class="fixed-label">🔒 固定預算，不可修改</div>
            </div>

        </div>

        <div class="budget-stats">

            <div class="stat-box">
                <div class="label">本月已花</div>
                <strong id="monthSpent">$0</strong>
            </div>

            <div class="stat-box green">
                <div class="label">目前可用</div>
                <strong id="monthAvailable">$15,000</strong>
            </div>

            <div class="stat-box orange">
                <div class="label">未來預定支出</div>
                <strong id="futureTotal">$0</strong>
            </div>

            <div class="stat-box green">
                <div class="label">可累積存款</div>
                <strong id="accumulatedSavings">$0</strong>
            </div>

        </div>
    </div>

    <!-- 今日 -->
    <div class="card">

        <div class="section-title">
            <h2>☀️ 今天可以怎麼花</h2>
            <span id="todayDate"></span>
        </div>

        <div class="today-grid">

            <div class="today-box blue">
                <div class="emoji">💰</div>
                <div class="label">今天基礎可用</div>
                <strong id="todayBudget">$0</strong>
            </div>

            <div class="today-box green">
                <div class="emoji">🛒</div>
                <div class="label">今天已花</div>
                <strong id="todaySpent">$0</strong>
            </div>

            <div class="today-box orange">
                <div class="emoji">✈️</div>
                <div class="label">今天預定支出</div>
                <strong id="todayFuture">$0</strong>
            </div>

            <div class="today-box green" id="todayRemainBox">
                <div class="emoji">✨</div>
                <div class="label">今天還能花</div>
                <strong id="todayRemaining">$0</strong>
            </div>

        </div>

    </div>

    <!-- 每週 -->
    <div class="card">

        <div class="section-title">
            <div>
                <h2>📊 每週預算</h2>
                <span id="weekDescription"></span>
            </div>
        </div>

        <div class="week-grid" id="weekGrid"></div>

    </div>

    <!-- 日曆 -->
    <div class="card">

        <div class="section-title">
            <h2>📅 當月日曆</h2>
            <span>點擊日期查看當天支出</span>
        </div>

        <div class="calendar" id="calendar"></div>

    </div>

    <!-- 未來支出 -->
    <div class="card">

        <div class="section-title">
            <div>
                <h2>✈️ 未來支出</h2>
                <span>提前安排，避免未來某週突然超支</span>
            </div>

            <button class="add-btn" onclick="openFutureModal()">+</button>
        </div>

        <div class="future-list" id="futureList"></div>

    </div>

    <!-- 記帳 -->
    <div class="card">

        <div class="section-title">
            <div>
                <h2>🧾 本月記帳</h2>
                <span>實際花費會影響每週剩餘預算</span>
            </div>

            <button class="add-btn" onclick="openExpenseModal()">+</button>
        </div>

        <div id="expenseList"></div>

    </div>

    <!-- 預計存款 -->
    <div class="card">

        <div class="section-title">
            <div>
                <h2>🏦 預計存款</h2>
                <span>可以自己新增你的存款目標</span>
            </div>

            <button class="add-btn" onclick="openSavingModal()">+</button>
        </div>

        <div class="savings-grid" id="savingsList"></div>

    </div>

</div>


<!-- =========================
     Future Expense Modal
========================= -->

<div class="modal-bg" id="futureModal">

    <div class="modal">

        <h2>✈️ 新增未來支出</h2>

        <div class="form-group">
            <label>出遊／支出名稱</label>
            <input id="futureName" placeholder="例如：小琉球">
        </div>

        <div class="form-group">
            <label>日期</label>
            <input type="date" id="futureDate">
        </div>

        <div class="form-group">
            <label>預算總額</label>
            <input type="number" id="futureBudget" placeholder="例如：1000">
        </div>

        <div class="form-group">
            <label>細項</label>

            <div id="detailEditor"></div>

            <button class="btn btn-light" onclick="addDetailRow()">
                ＋ 新增細項
            </button>
        </div>

        <div class="modal-buttons">
            <button class="btn btn-light" onclick="closeModal('futureModal')">
                取消
            </button>

            <button class="btn btn-primary" onclick="saveFuture()">
                儲存
            </button>
        </div>

    </div>

</div>


<!-- =========================
     Expense Modal
========================= -->

<div class="modal-bg" id="expenseModal">

    <div class="modal">

        <h2>🧾 新增記帳</h2>

        <div class="form-group">
            <label>日期</label>
            <input type="date" id="expenseDate">
        </div>

        <div class="form-group">
            <label>項目</label>
            <input id="expenseName" placeholder="例如：午餐">
        </div>

        <div class="form-group">
            <label>金額</label>
            <input type="number" id="expenseAmount" placeholder="例如：120">
        </div>

        <div class="form-group">
            <label>分類</label>
            <select id="expenseCategory">
                <option value="餐飲">🍜 餐飲</option>
                <option value="交通">🚌 交通</option>
                <option value="購物">🛍️ 購物</option>
                <option value="娛樂">🎮 娛樂</option>
                <option value="其他">📦 其他</option>
            </select>
        </div>

        <div class="modal-buttons">
            <button class="btn btn-light" onclick="closeModal('expenseModal')">
                取消
            </button>

            <button class="btn btn-primary" onclick="saveExpense()">
                儲存
            </button>
        </div>

    </div>

</div>


<!-- =========================
     Saving Modal
========================= -->

<div class="modal-bg" id="savingModal">

    <div class="modal">

        <h2>🏦 新增預計存款</h2>

        <div class="form-group">
            <label>存款名稱</label>
            <input id="savingName" placeholder="例如：日本旅遊基金">
        </div>

        <div class="form-group">
            <label>目標金額</label>
            <input type="number" id="savingTarget" placeholder="例如：10000">
        </div>

        <div class="form-group">
            <label>目前已存</label>
            <input type="number" id="savingCurrent" placeholder="例如：2000" value="0">
        </div>

        <div class="modal-buttons">
            <button class="btn btn-light" onclick="closeModal('savingModal')">
                取消
            </button>

            <button class="btn btn-primary" onclick="saveSaving()">
                儲存
            </button>
        </div>

    </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

const MONTHLY_BUDGET = 15000;

let currentDate = new Date();

let data = JSON.parse(
    localStorage.getItem("weeklyBudgetApp")
) || {
    expenses: [],
    futureExpenses: [],
    savings: []
};


/* =====================================================
   工具
===================================================== */

function money(value) {
    return "$" + Math.round(value).toLocaleString("zh-TW");
}

function dateKey(date) {
    const d = new Date(date);

    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${y}-${m}-${day}`;
}

function saveData() {
    localStorage.setItem(
        "weeklyBudgetApp",
        JSON.stringify(data)
    );
}

function daysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
}


/* =====================================================
   月份
===================================================== */

function getYear() {
    return currentDate.getFullYear();
}

function getMonth() {
    return currentDate.getMonth();
}

function changeMonth(direction) {

    currentDate.setMonth(
        currentDate.getMonth() + direction
    );

    renderAll();
}


/* =====================================================
   當月週數
===================================================== */

function getMonthWeeks(year, month) {

    const firstDay = new Date(year, month, 1);

    const totalDays = daysInMonth(year, month);

    /*
       這裡不是單純用 7 天切割，
       而是按照月曆上的星期區間計算。

       例如：
       8/1 如果落在星期六，
       第一週就是 8/1～8/1。
    */

    const startOffset = firstDay.getDay();

    return Math.ceil(
        (startOffset + totalDays) / 7
    );
}


/* =====================================================
   週資訊
===================================================== */

function getWeekIndex(date) {

    const year = date.getFullYear();
    const month = date.getMonth();

    const firstDay = new Date(year, month, 1);

    const dayOfMonth = date.getDate();

    return Math.floor(
        (firstDay.getDay() + dayOfMonth - 1) / 7
    );
}

function getWeekBudget() {

    const weeks = getMonthWeeks(
        getYear(),
        getMonth()
    );

    return MONTHLY_BUDGET / weeks;
}

function getDayBudget() {

    return getWeekBudget() / 7;
}


/* =====================================================
   支出
===================================================== */

function getMonthExpenses() {

    const y = getYear();
    const m = getMonth();

    return data.expenses.filter(item => {

        const d = new Date(item.date);

        return (
            d.getFullYear() === y &&
            d.getMonth() === m
        );
    });
}

function getMonthSpent() {

    return getMonthExpenses()
        .reduce(
            (sum, item) =>
                sum + Number(item.amount),
            0
        );
}

function getDaySpent(date) {

    const key = dateKey(date);

    return data.expenses
        .filter(item => item.date === key)
        .reduce(
            (sum, item) =>
                sum + Number(item.amount),
            0
        );
}


/* =====================================================
   未來支出
===================================================== */

function getFutureForMonth() {

    const y = getYear();
    const m = getMonth();

    return data.futureExpenses.filter(item => {

        const d = new Date(item.date);

        return (
            d.getFullYear() === y &&
            d.getMonth() === m
        );
    });
}

function getFutureTotal() {

    return getFutureForMonth()
        .reduce(
            (sum, item) =>
                sum + Number(item.budget),
            0
        );
}

function getFutureForDate(date) {

    const key = dateKey(date);

    return data.futureExpenses
        .filter(item => item.date === key)
        .reduce(
            (sum, item) =>
                sum + Number(item.budget),
            0
        );
}


/* =====================================================
   預計支出對週預算的影響
===================================================== */

function getFutureForWeek(weekIndex) {

    const year = getYear();
    const month = getMonth();

    return getFutureForMonth()
        .filter(item => {

            const d = new Date(item.date);

            return getWeekIndex(d) === weekIndex;
        })
        .reduce(
            (sum, item) =>
                sum + Number(item.budget),
            0
        );
}

function getSpentForWeek(weekIndex) {

    return getMonthExpenses()
        .filter(item => {

            const d = new Date(item.date);

            return getWeekIndex(d) === weekIndex;
        })
        .reduce(
            (sum, item) =>
                sum + Number(item.amount),
            0
        );
}


/* =====================================================
   預計存款
===================================================== */

function getAccumulatedSavings() {

    const weeks = getMonthWeeks(
        getYear(),
        getMonth()
    );

    let result = 0;

    for (let i = 0; i < weeks; i++) {

        const spent = getSpentForWeek(i);
        const future = getFutureForWeek(i);

        const remain =
            getWeekBudget() -
            spent -
            future;

        if (remain > 0) {
            result += remain;
        }
    }

    return result;
}

    for (let i = 0; i < weeks; i++) {

        const spent =
            getSpentForWeek(i);

        const future =
            getFutureForWeek(i);

        const available =
            getWeekBudget() -
            spent -
            future;

        const used =
            spent + future;

        const percent =
            Math.min(
                100,
                Math.max(
                    0,
                    (used / getWeekBudget()) * 100

            );

/* =====================================================
   Render Calendar
===================================================== */

function renderCalendar() {

    const container =
        document.getElementById(
            "calendar"
        );

    container.innerHTML = "";

    const weekdays =
        ["日","一","二","三","四","五","六"];

    weekdays.forEach(day => {

        const el =
            document.createElement("div");

        el.className =
            "calendar-weekday";

        el.textContent = day;

        container.appendChild(el);
    });

    const year = getYear();
    const month = getMonth();

    const firstDay =
        new Date(year, month, 1);

    const totalDays =
        daysInMonth(year, month);

    for (
        let i = 0;
        i < firstDay.getDay();
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        container.appendChild(empty);
    }

    const today =
        new Date();

    for (
        let day = 1;
        day <= totalDays;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );

        const spent =
            getDaySpent(date);

        const future =
            getFutureForDate(date);

        const el =
            document.createElement("div");

        const isToday =
            dateKey(date) === dateKey(today);

        el.className =
            "day" +
            (isToday ? " today" : "");

        el.innerHTML = `

            <div class="day-number">
                ${day}
            </div>

            ${
                future > 0
                ? `<div class="day-dot"></div>`
                : ""
            }

            <div class="day-budget">
                可用 ${money(getDayBudget())}
            </div>

            ${
                spent > 0
                ? `<div class="day-spent">
                    已花 ${money(spent)}
                   </div>`
                : ""
            }

            ${
                future > 0
                ? `<div class="day-future">
                    預定 ${money(future)}
                   </div>`
                : ""
            }
        `;

        el.onclick = () => {

            const dateText =
                `${year}/${month + 1}/${day}`;

            alert(
                `${dateText}\n\n` +
                `每日基礎預算：${money(getDayBudget())}\n` +
                `已花：${money(spent)}\n` +
                `預定支出：${money(future)}\n` +
                `目前剩餘：${money(
                    Math.max(
                        0,
                        getDayBudget() -
                        spent -
                        future
                    )
                )}`
            );
        };

        container.appendChild(el);
    }
}

/* =====================================================
   Future 支出記錄
===================================================== */

function addFutureSpent(id) {

    const item =
        data.futureExpenses.find(
            x => x.id === id
        );

    if (!item) return;

    const amount =
        Number(
            prompt(
                `「${item.name}」目前預算 ${money(item.budget)}\n\n請輸入這次實際花費金額：`
            )
        );

    if (
        !amount ||
        amount <= 0
    ) {
        return;
    }

    item.spent =
        Number(item.spent || 0) +
        amount;

    /*
       同時把實際支出加入一般記帳，
       讓它真正影響當週預算。
    */

    data.expenses.push({

        id: Date.now(),

        date: item.date,

        name: item.name,

        amount: amount,

        category: "✈️ 未來支出"
    });

    saveData();

    renderAll();
}

function deleteFuture(id) {

    if (
        !confirm(
            "確定要刪除這筆未來支出嗎？"
        )
    ) {
        return;
    }

    data.futureExpenses =
        data.futureExpenses.filter(
            x => x.id !== id
        );

    saveData();

    renderAll();
}

function saveSaving() {

    const name =
        document.getElementById(
            "savingName"
        ).value.trim();

    const target =
        Number(
            document.getElementById(
                "savingTarget"
            ).value
        );

    const current =
        Number(
            document.getElementById(
                "savingCurrent"
            ).value
        );

    if (
        !name ||
        target <= 0
    ) {

        alert(
            "請輸入存款名稱及目標金額"
        );

        return;
    }

    data.savings.push({

        id: Date.now(),

        name,

        target,

        current
    });

    saveData();

    closeModal("savingModal");

    renderAll();
}

function deleteSaving(id) {

    if (
        !confirm(
            "確定要刪除這個存款目標嗎？"
        )
    ) {
        return;
    }

    data.savings =
        data.savings.filter(
            x => x.id !== id
        );

    saveData();

    renderAll();
}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(str) {

    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   Render All
===================================================== */

function renderAll() {

    renderHeader();

    renderBudget();

    renderToday();

    renderWeeks();

    renderCalendar();

    renderFuture();

    renderExpenses();

    renderSavings();
}


/* =====================================================
   初始化
===================================================== */

renderAll();

</script>
