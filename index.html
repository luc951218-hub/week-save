<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>週週存</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --text: #0f172a;
            --sub: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; max-width: 480px; margin: 0 auto; }
        
        /* Header */
        header { padding: 20px 16px 10px; text-align: center; background: #fff; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 20px; font-weight: 800; }

        /* Pages Section */
        .page { display: none; padding: 16px; }
        .page.active { display: block; }

        /* Common Cards */
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        .card-title { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
        .big-number { font-size: 32px; font-weight: 800; color: var(--text); }

        /* Progress Bar */
        .progress-bar { height: 12px; background: #f1f5f9; border-radius: 6px; overflow: hidden; margin: 12px 0 8px; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }

        /* Grid Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .stat-box { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; }
        .stat-box .num { font-size: 16px; font-weight: 700; margin-top: 4px; }

        /* Form Inputs */
        .input-group { margin-bottom: 12px; }
        label { font-size: 13px; color: var(--sub); font-weight: 600; display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; background: #f8fafc; outline: none; }
        button.btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; margin-top: 8px; cursor: pointer; }

        /* Transaction List */
        .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .tx-item:last-child { border-bottom: none; }
        .tx-icon { font-size: 20px; margin-right: 12px; width: 36px; height: 36px; background: #f1f5f9; border-radius: 18px; display: flex; align-items: center; justify-content: center; }

        /* Calendar Styles */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-head { font-size: 12px; color: var(--sub); font-weight: 600; padding: 6px 0; }
        .cal-day { font-size: 14px; padding: 8px 0; border-radius: 10px; cursor: pointer; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .cal-day.active-day { background: var(--primary); color: white; font-weight: 700; }
        .cal-day.today { border: 1px solid var(--primary); }
        .cal-dot { width: 4px; height: 4px; background: var(--danger); border-radius: 2px; margin-top: 2px; }
        .cal-day.active-day .cal-dot { background: white; }

        /* Bottom Nav Tab */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; height: 65px; background: #ffffff; display: flex; border-top: 1px solid var(--border); box-shadow: 0 -4px 20px rgba(0,0,0,0.03); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--sub); font-weight: 600; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>💰 週週存</h1>
    </header>

    <!-- 1. 首頁 (本週概況) -->
    <div id="page-home" class="page active">
        <!-- 月總預算概況卡片 -->
        <div class="card" style="background: #f1f5f9; padding: 14px 20px; margin-bottom: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span class="card-title" style="margin: 0;">🗓️ 本月總預算：<b>NT$ 15,000</b></span>
                <span style="font-size: 12px; color: var(--primary); font-weight: 600;" id="weeklyCalcTag">視週期分算</span>
            </div>
            <div style="font-size: 12px; color: var(--sub); font-weight: 600;" id="weekRangeText">本週區間：--</div>
        </div>

        <div class="card">
            <div class="card-title">本週可用預算剩餘</div>
            <div class="big-number" id="weeklyRemaining">NT$ 0</div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--sub);">
                <span>已用: <b id="weeklySpent">NT$ 0</b> / 目標 <span id="weeklyTarget">NT$ 0</span></span>
                <span id="percentText">0%</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="card-title">📅 本週剩餘天數</div>
                    <div class="num" id="daysLeft">-- 天</div>
                </div>
                <div class="stat-box">
                    <div class="card-title">💡 今日建議花費</div>
                    <div class="num" style="color: var(--success);" id="dailyBudget">NT$ --</div>
                </div>
            </div>
        </div>

        <!-- 預備金狀態 -->
        <div class="card" style="background: linear-gradient(135deg, #e0e7ff 0%, #ffffff 100%);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="card-title" style="color: var(--primary);">🛟 本月緊急預備金</div>
                    <div style="font-size: 20px; font-weight: 800; color: var(--primary);" id="reserveRemaining">NT$ 1,000</div>
                </div>
                <div style="text-align: right; font-size: 12px; color: var(--sub);">
                    月額度 NT$ 1,000
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">近期支出</div>
            <div id="homeTxList"></div>
        </div>
    </div>

    <!-- 2. 記帳頁面 -->
    <div id="page-add" class="page">
        <div class="card">
            <div class="card-title" style="margin-bottom: 16px;">快速新增支出</div>

            <div class="input-group">
                <label>支出日期</label>
                <input type="date" id="txDate">
            </div>

            <!-- 新增：支付方式選單 -->
            <div class="input-group">
                <label>支付方式</label>
                <select id="txPayment">
                    <option value="💵 現金">💵 現金</option>
                    <option value="💳 信用卡">💳 信用卡</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>支出扣款來源</label>
                <select id="txType">
                    <option value="weekly">本週日常預算</option>
                    <option value="reserve">🛟 緊急預備金</option>
                </select>
            </div>

            <div class="input-group">
                <label>金額</label>
                <input type="number" id="txAmount" placeholder="0" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>分類</label>
                <select id="txCategory">
                    <option value="🍚 餐飲">🍚 餐飲</option>
                    <option value="🛍️ 購物">🛍️ 購物</option>
                    <option value="🎮 娛樂">🎮 娛樂</option>
                    <option value="🚗 交通">🚗 交通</option>
                    <option value="☕ 飲料">☕ 飲料</option>
                    <option value="📦 其他">📦 其他</option>
                </select>
            </div>

            <div class="input-group">
                <label>備註</label>
                <input type="text" id="txNote" placeholder="例如：午餐、搭車">
            </div>

            <button class="btn-primary" onclick="addTransaction()">完成並扣款</button>
        </div>
    </div>

    <!-- 3. 日曆頁面 -->
    <div id="page-calendar" class="page">
        <div class="card">
            <div class="calendar-header">
                <span id="calMonthTitle">2026年 8月</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="card">
            <div class="card-title" id="selectedDateTitle">點擊日曆查看當日明細</div>
            <div id="calendarDayTxList"></div>
        </div>
    </div>

    <!-- 4. 分析頁面 -->
    <div id="page-analytics" class="page">
        <!-- 新增：支付方式統計卡片 -->
        <div class="card">
            <div class="card-title">💳 支付方式小計</div>
            <div class="stats-grid" style="margin-top: 8px;">
                <div class="stat-box">
                    <div class="card-title">💵 現金花費</div>
                    <div class="num" id="totalCashSpent">NT$ 0</div>
                </div>
                <div class="stat-box">
                    <div class="card-title">💳 信用卡花費</div>
                    <div class="num" id="totalCardSpent" style="color: var(--primary);">NT$ 0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 本週分類花費</div>
            <div id="categoryAnalysis" style="margin-top: 12px;"></div>
        </div>
    </div>

    <!-- 5. 存款頁面 -->
    <div id="page-savings" class="page">
        <div class="card" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white;">
            <div class="card-title" style="color: #ecfdf5;">💰 累積存款總額</div>
            <div class="big-number" style="color: white;" id="totalSavings">NT$ 0</div>
            <div style="margin-top: 12px; font-size: 13px; opacity: 0.9;">每週剩餘預算與月底預備金剩餘會自動存入此處</div>
        </div>

        <div class="card">
            <div class="card-title">🗓️ 存款紀錄</div>
            <div id="savingsHistory"></div>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)">
            <span>🏠</span>首頁
        </div>
        <div class="nav-item" onclick="switchPage('add', this)">
            <span>➕</span>記帳
        </div>
        <div class="nav-item" onclick="switchPage('calendar', this)">
            <span>🗓️</span>日曆
        </div>
        <div class="nav-item" onclick="switchPage('analytics', this)">
            <span>📊</span>分析
        </div>
        <div class="nav-item" onclick="switchPage('savings', this)">
            <span>💰</span>存款
        </div>
    </div>

    <script>
        const MONTHLY_TOTAL = 15000;
        const RESERVE_BUDGET = 1000;

        let state = JSON.parse(localStorage.getItem('week_save_state')) || {
            transactions: [],
            totalSavings: 0,
            reserveSpent: 0
        };

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('txDate').value = todayStr;
        let selectedCalDate = todayStr;

        function getWeeksInMonth() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const usedDays = firstDay.getDay() + lastDay.getDate();
            return Math.ceil(usedDays / 7);
        }

        function getWeeklyTarget() {
            const weeks = getWeeksInMonth();
            const availableForWeeks = MONTHLY_TOTAL - RESERVE_BUDGET;
            return Math.floor(availableForWeeks / weeks);
        }

        function getWeekRangeText() {
            const now = new Date();
            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
            
            const monday = new Date(now);
            monday.setDate(now.getDate() - (dayOfWeek - 1));
            
            const sunday = new Date(now);
            sunday.setDate(now.getDate() + (7 - dayOfWeek));

            const mMonth = monday.getMonth() + 1;
            const mDate = monday.getDate();
            const sMonth = sunday.getMonth() + 1;
            const sDate = sunday.getDate();

            return `本週區間：${mMonth}/${mDate} (一) - ${sMonth}/${sDate} (日)`;
        }

        function saveState() {
            localStorage.setItem('week_save_state', JSON.stringify(state));
        }

        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            element.classList.add('active');
            render();
        }

        function getWeeklySpent() {
            return state.transactions
                .filter(t => t.type === 'weekly')
                .reduce((sum, t) => sum + t.amount, 0);
        }

        function addTransaction() {
            const date = document.getElementById('txDate').value;
            const payment = document.getElementById('txPayment').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;
            const note = document.getElementById('txNote').value.trim();
            const type = document.getElementById('txType').value;

            if (!date) {
                alert('請選擇日期！');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                alert('請輸入有效金額！');
                return;
            }

            if (type === 'reserve' && (state.reserveSpent + amount) > RESERVE_BUDGET) {
                alert('緊急預備金餘額不足！');
                return;
            }

            state.transactions.push({
                id: Date.now(),
                type,
                payment: payment || '💵 現金',
                amount,
                category,
                note,
                date: date
            });

            if (type === 'reserve') {
                state.reserveSpent += amount;
            }

            saveState();

            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
            
            switchPage('home', document.querySelectorAll('.nav-item')[0]);
        }

        function renderCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            document.getElementById('calMonthTitle').innerText = `${year}年 ${month + 1}月`;

            const days = ['日', '一', '二', '三', '四', '五', '六'];
            days.forEach(d => {
                const head = document.createElement('div');
                head.className = 'cal-day-head';
                head.innerText = d;
                calendarGrid.appendChild(head);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarGrid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedCalDate) dayDiv.classList.add('active-day');

                dayDiv.innerText = day;

                const hasTx = state.transactions.some(t => t.date === dateStr);
                if (hasTx) {
                    const dot = document.createElement('div');
                    dot.className = 'cal-dot';
                    dayDiv.appendChild(dot);
                }

                dayDiv.onclick = () => {
                    selectedCalDate = dateStr;
                    renderCalendar();
                    renderCalendarDayDetails(dateStr);
                };

                calendarGrid.appendChild(dayDiv);
            }

            renderCalendarDayDetails(selectedCalDate);
        }

        function renderCalendarDayDetails(dateStr) {
            document.getElementById('selectedDateTitle').innerText = `${dateStr} 支出明細`;
            const list = document.getElementById('calendarDayTxList');
            list.innerHTML = '';

            const txs = state.transactions.filter(t => t.date === dateStr);
            if (txs.length === 0) {
                list.innerHTML = '<div style="font-size:13px; color:var(--sub); padding:10px 0;">當日無支出紀錄</div>';
                return;
            }

            let total = 0;
            txs.forEach(t => {
                total += t.amount;
                const paymentLabel = t.payment || '💵 現金';
                const item = document.createElement('div');
                item.className = 'tx-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <div class="tx-icon">${t.category.split(' ')[0]}</div>
                        <div>
                            <div style="font-weight: 700; font-size: 14px;">${t.note || t.category}</div>
                            <div style="font-size: 11px; color: var(--sub);">${paymentLabel} · ${t.type === 'reserve' ? '🛟 預備金' : '日常預算'}</div>
                        </div>
                    </div>
                    <div style="font-weight: 700; color: var(--danger);">-NT$ ${t.amount.toLocaleString()}</div>
                `;
                list.appendChild(item);
            });

            const sumDiv = document.createElement('div');
            sumDiv.style.cssText = 'text-align:right; font-weight:700; font-size:14px; margin-top:12px; color:var(--text);';
            sumDiv.innerText = `當日總計：NT$ ${total.toLocaleString()}`;
            list.appendChild(sumDiv);
        }

        function render() {
            const weeklyTarget = getWeeklyTarget();
            const weeklySpent = getWeeklySpent();
            const remaining = weeklyTarget - weeklySpent;
            const percent = Math.min(100, Math.round((weeklySpent / weeklyTarget) * 100));

            document.getElementById('weekRangeText').innerText = getWeekRangeText();
            document.getElementById('weeklyCalcTag').innerText = `本月包含 ${getWeeksInMonth()} 週 (每週約 $${weeklyTarget.toLocaleString()})`;
            document.getElementById('weeklyTarget').innerText = `NT$ ${weeklyTarget.toLocaleString()}`;
            document.getElementById('weeklyRemaining').innerText = `NT$ ${remaining.toLocaleString()}`;
            document.getElementById('weeklySpent').innerText = `NT$ ${weeklySpent.toLocaleString()}`;
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('percentText').innerText = `${percent}%`;

            const now = new Date();
            const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
            const daysLeft = 8 - dayOfWeek; 
            document.getElementById('daysLeft').innerText = `${daysLeft} 天`;

            const dailyBudget = daysLeft > 0 ? Math.max(0, Math.round(remaining / daysLeft)) : 0;
            document.getElementById('dailyBudget').innerText = `NT$ ${dailyBudget.toLocaleString()}`;

            const reserveRemaining = RESERVE_BUDGET - state.reserveSpent;
            document.getElementById('reserveRemaining').innerText = `NT$ ${reserveRemaining.toLocaleString()}`;

            document.getElementById('totalSavings').innerText = `NT$ ${state.totalSavings.toLocaleString()}`;

            // 近期支出渲染
            const homeList = document.getElementById('homeTxList');
            homeList.innerHTML = '';
            state.transactions.slice(-5).reverse().forEach(t => {
                const paymentLabel = t.payment || '💵 現金';
                const item = document.createElement('div');
                item.className = 'tx-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <div class="tx-icon">${t.category.split(' ')[0]}</div>
                        <div>
                            <div style="font-weight: 700; font-size: 14px;">${t.note || t.category}</div>
                            <div style="font-size: 11px; color: var(--sub);">${t.date} · ${paymentLabel} · ${t.type === 'reserve' ? '預備金' : '日常預算'}</div>
                        </div>
                    </div>
                    <div style="font-weight: 700; color: var(--danger);">-NT$ ${t.amount.toLocaleString()}</div>
                `;
                homeList.appendChild(item);
            });

            // 分析統計渲染 (支付方式 + 分類)
            let cashTotal = 0;
            let cardTotal = 0;
            const categories = {};

            state.transactions.forEach(t => {
                const pay = t.payment || '💵 現金';
                if (pay.includes('現金')) cashTotal += t.amount;
                if (pay.includes('信用卡')) cardTotal += t.amount;

                categories[t.category] = (categories[t.category] || 0) + t.amount;
            });

            document.getElementById('totalCashSpent').innerText = `NT$ ${cashTotal.toLocaleString()}`;
            document.getElementById('totalCardSpent').innerText = `NT$ ${cardTotal.toLocaleString()}`;

            const analyticsList = document.getElementById('categoryAnalysis');
            analyticsList.innerHTML = '';
            for (let cat in categories) {
                const div = document.createElement('div');
                div.className = 'tx-item';
                div.innerHTML = `
                    <div style="font-weight: 600;">${cat}</div>
                    <div style="font-weight: 700;">NT$ ${categories[cat].toLocaleString()}</div>
                `;
                analyticsList.appendChild(div);
            }

            renderCalendar();
        }

        render();
    </script>
</body>
</html>
