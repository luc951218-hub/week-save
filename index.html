<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>週週記 - 個人記帳與每週預算管理</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #007aff;
            --text: #1c1c1e;
            --sub: #8e8e93;
            --border: #e5e5ea;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
        }

        .header {
            background: var(--card-bg);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 0.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .amount-large {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--sub);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            background: var(--bg);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 0.5px solid var(--border);
        }

        .nav-item {
            text-align: center;
            font-size: 10px;
            color: var(--sub);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item div {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--border);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .ai-card {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            border: 1px solid #bbdefb;
        }

        /* 今日規劃支出比對卡片樣式 */
        .today-plan-card {
            background: #ffffff;
            border: 0.5px solid rgba(0, 122, 255, 0.2);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }
        .today-plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
        }
        .today-plan-item {
            background: #f8f8fa;
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 8px;
            border: 0.5px solid rgba(0,0,0,0.04);
        }
        .today-plan-item .item-title {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .today-plan-item .item-status {
            font-size: 12px;
            color: var(--sub);
            display: flex;
            justify-content: space-between;
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.ok {
            background: #e1f8eb;
            color: #34c759;
        }
        .status-badge.over {
            background: #ffe5e5;
            color: #ff3b30;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">週週記 - 首頁概況</h1>
        <button onclick="exportData()" style="width: auto; padding: 6px 12px; font-size: 12px;">匯出</button>
    </div>

    <div class="container">
        <div id="page-home" class="page active">
            <div class="card ai-card" id="aiCard">
                <div class="card-title">🤖 AI 財務助理</div>
                <div id="aiMessage" style="font-size: 14px; line-height: 1.4;">分析中...</div>
            </div>

            <div id="todayPlanMonitor" class="today-plan-card" style="display: none;">
                <div class="today-plan-header">
                    <span>🗓️ 今日規劃支出監控</span>
                    <span id="todayPlanDate" style="font-size:12px; color:var(--sub);"></span>
                </div>
                <div id="todayPlanList"></div>
            </div>

            <div class="card" style="border: 1px solid rgba(52, 199, 89, 0.3); background: #f6ffed;">
                <div class="card-title" style="color: #27823b; font-weight: 600;">📅 本週分配預算實時控管</div>
                <div class="amount-large" id="weeklyBudgetSpentText" style="color: #1b5226;">NT$ 0 / 0</div>
                <div style="font-size: 12px; color: #52825a; margin-top: 4px;" id="weeklyBudgetSubtext">本週剩餘可花費: NT$ 0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="weeklyBudgetProgress" style="background: var(--success);"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">本月總支出</div>
                <div class="amount-large" id="totalExpense">NT$ 0</div>
            </div>

            <div class="grid-2">
                <div class="card">
                    <div class="card-title">本月總收入</div>
                    <div style="font-size: 18px; font-weight: bold; color: var(--success);" id="totalIncome">NT$ 0</div>
                </div>
                <div class="card">
                    <div class="card-title">月度結餘</div>
                    <div style="font-size: 18px; font-weight: bold;" id="netSavings">NT$ 0</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">支出分類統計</div>
                <canvas id="categoryChart" style="max-height: 200px;"></canvas>
            </div>
        </div>

        <div id="page-add" class="page">
            <div class="card">
                <div class="form-group">
                    <label>類型</label>
                    <select id="transType" onchange="updateCategories()">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>金額</label>
                    <input type="number" id="transAmount" placeholder="0">
                </div>
                <div class="form-group">
                    <label>分類</label>
                    <select id="transCategory"></select>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="transDate">
                </div>
                <div class="form-group">
                    <label>備註</label>
                    <input type="text" id="transNote" placeholder="選填">
                </div>
                <button onclick="addTransaction()">儲存記帳</button>
            </div>
        </div>

        <div id="page-budget" class="page">
            <div class="card">
                <div class="card-title">每月預算與預備金設定</div>
                <div class="form-group">
                    <label>月總預算</label>
                    <input type="number" id="monthlyBudgetInput" value="15000" placeholder="例如: 15000">
                </div>
                <div class="form-group">
                    <label>預備金 (不納入每週分配)</label>
                    <input type="number" id="reserveFundInput" value="1000" placeholder="例如: 1000">
                </div>
                <button onclick="setMonthlyBudget()">儲存設定並自動計算週預算</button>
            </div>

            <div class="card">
                <div class="card-title">自動每週預算拆解</div>
                <div style="font-size: 13px; color: var(--sub); margin-bottom: 8px;" id="weeklyCalcDetail">
                    當月共有 - 週 | 預備金: NT$ 1,000
                </div>
                <div style="font-size: 16px; font-weight: bold; color: var(--primary);" id="weeklyBudgetAmount">
                    每週可用預算: NT$ 0
                </div>
            </div>

            <div class="card">
                <div class="card-title">本月總預算消耗進度</div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                    <span id="budgetSpent">已花費: NT$ 0</span>
                    <span id="budgetTotal">預算: NT$ 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="budgetProgress"></div>
                </div>
            </div>
        </div>

        <div id="page-plans" class="page">
            <div class="card">
                <div class="card-title">新增儲蓄目標</div>
                <div class="form-group"><input type="text" id="savingsName" placeholder="目標名稱 (例: 旅遊基金)"></div>
                <div class="form-group"><input type="number" id="savingsTarget" placeholder="目標金額"></div>
                <div class="form-group"><input type="number" id="savingsCurrent" placeholder="已存金額"></div>
                <button onclick="addSavingsGoal()">新增目標</button>
            </div>

            <div class="card">
                <div class="card-title">儲蓄目標列表</div>
                <div id="savingsList"></div>
            </div>

            <div class="card">
                <div class="card-title">新增特別預期支出 (未來活動)</div>
                <div class="form-group"><input type="text" id="planTitle" placeholder="活動名稱 (例: 日本旅遊)"></div>
                <div class="form-group"><input
