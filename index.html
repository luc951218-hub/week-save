<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週週記｜個人記帳</title>

<style>
:root {
    --primary: #007aff;
    --primary-light: #eaf4ff;
    --green: #34c759;
    --green-light: #e9f9ee;
    --orange: #ff9500;
    --orange-light: #fff4df;
    --red: #ff3b30;
    --red-light: #ffe9e7;
    --purple: #8e5cff;
    --purple-light: #f1ebff;

    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --border: #e5e5ea;
    --shadow: 0 4px 18px rgba(0,0,0,.06);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1200px, calc(100% - 28px));
    margin: 0 auto;
    padding-bottom: 60px;
}

/* =========================
   Header
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 0 20px;
}

.brand h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -1px;
}

.brand p {
    margin: 5px 0 0;
    color: var(--sub);
    font-size: 14px;
}

.month-control {
    display: flex;
    align-items: center;
    gap: 8px;
}

.month-control button {
    width: 38px;
    height: 38px;
    border: none;
    background: white;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 18px;
}

.month-title {
    min-width: 110px;
    text-align: center;
    font-weight: 700;
}

/* =========================
   Summary
========================= */

.summary-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr 1fr;
    gap: 14px;
}

.card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.budget-card {
    padding: 22px;
    position: relative;
    overflow: hidden;
}

.budget-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.label {
    color: var(--sub);
    font-size: 13px;
}

.amount {
    font-size: 29px;
    font-weight: 800;
    margin-top: 5px;
    letter-spacing: -1px;
}

.fixed-badge {
    background: var(--primary-light);
    color: var(--primary);
    padding: 5px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
}

.progress {
    margin-top: 18px;
    height: 10px;
    background: #edf0f3;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0;
    border-radius: 10px;
    background: var(--primary);
    transition: width .3s ease;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: var(--sub);
    font-size: 12px;
}

.stat-card {
    padding: 20px;
    min-height: 145px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}

.blue {
    background: var(--primary-light);
}

.green {
    background: var(--green-light);
}

.orange {
    background: var(--orange-light);
}

.purple {
    background: var(--purple-light);
}

.stat-number {
    font-size: 24px;
    font-weight: 800;
}

.stat-desc {
    color: var(--sub);
    font-size: 12px;
}

/* =========================
   Weekly budget
========================= */

.section {
    margin-top: 20px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-title h2 {
    margin: 0;
    font-size: 18px;
}

.section-title span {
    color: var(--sub);
    font-size: 12px;
}

.week-card {
    padding: 20px;
}

.week-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.week-name {
    font-weight: 800;
}

.week-date {
    color: var(--sub);
    font-size: 12px;
    margin-top: 4px;
}

.week-available {
    text-align: right;
}

.week-available .small {
    color: var(--sub);
    font-size: 11px;
}

.week-available .big {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
}

.week-progress {
    height: 10px;
    margin: 16px 0 12px;
    background: #edf0f3;
    border-radius: 10px;
    overflow: hidden;
}

.week-progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 10px;
}

.week-details {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.week-detail {
    background: #f8f8fa;
    border-radius: 12px;
    padding: 10px;
}

.week-detail span {
    display: block;
    color: var(--sub);
    font-size: 11px;
}

.week-detail strong {
    display: block;
    margin-top: 4px;
    font-size: 15px;
}

/* =========================
   Dashboard grid
========================= */

.main-grid {
    display: grid;
    grid-template-columns: 1.35fr .9fr;
    gap: 18px;
    margin-top: 20px;
}

/* =========================
   Calendar
========================= */

.calendar-card {
    padding: 20px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.calendar-header h2 {
    margin: 0;
    font-size: 18px;
}

.calendar-header button {
    border: none;
    background: var(--primary-light);
    color: var(--primary);
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
}

.calendar-weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

.calendar-weekdays div {
    text-align: center;
    color: var(--sub);
    font-size: 11px;
    padding-bottom: 8px;
}

.day {
    min-height: 75px;
    border: 1px solid #f0f0f2;
    padding: 7px;
    position: relative;
    background: white;
}

.day.empty {
    background: #fafafa;
}

.day.today {
    background: var(--primary-light);
}

.day-number {
    font-size: 12px;
    font-weight: 700;
}

.day-expense {
    font-size: 11px;
    margin-top: 10px;
    color: var(--text);
}

.day-expense.high {
    color: var(--red);
    font-weight: 700;
}

.future-dot {
    position: absolute;
    right: 7px;
    top: 7px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple);
}

.day:hover {
    background: #f4f8ff;
}

/* =========================
   Weekly visual
========================= */

.chart-card {
    padding: 20px;
}

.chart {
    height: 220px;
    display: flex;
    align-items: flex-end;
    gap: 9px;
    padding-top: 25px;
}

.bar-wrap {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
}

.bar {
    width: 100%;
    max-width: 34px;
    border-radius: 8px 8px 3px 3px;
    background: var(--primary);
    min-height: 4px;
    transition: height .3s ease;
}

.bar-label {
    position: absolute;
    bottom: -23px;
    font-size: 10px;
    color: var(--sub);
}

.bar-value {
    position: absolute;
    top: -20px;
    font-size: 9px;
    color: var(--sub);
}

/* =========================
   Future plans
========================= */

.future-card {
    padding: 20px;
}

.future-total {
    background: var(--purple-light);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
}

.future-total span {
    color: #7650d9;
    font-size: 12px;
}

.future-total strong {
    display: block;
    color: var(--purple);
    font-size: 25px;
    margin-top: 3px;
}

.future-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.future-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
    border-radius: 13px;
    padding: 12px;
}

.future-left {
    display: flex;
    gap: 10px;
    align-items: center;
}

.future-icon {
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.future-title {
    font-size: 13px;
    font-weight: 700;
}

.future-date {
    color: var(--sub);
    font-size: 11px;
    margin-top: 3px;
}

.future-money {
    font-weight: 800;
    color: var(--purple);
}

.delete-btn {
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 14px;
    margin-left: 5px;
}

/* =========================
   AI card
========================= */

.ai-card {
    margin-top: 18px;
    padding: 20px;
    background: linear-gradient(135deg,#e9f4ff,#fff);
    border: 1px solid #cfe5ff;
}

.ai-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
}

.ai-content {
    margin-top: 12px;
    line-height: 1.7;
    font-size: 13px;
}

.ai-highlight {
    color: var(--primary);
    font-weight: 800;
}

/* =========================
   Transactions
========================= */

.transaction-card {
    margin-top: 20px;
    padding: 20px;
}

.add-btn {
    border: none;
    background: var(--primary);
    color: white;
    border-radius: 12px;
    padding: 9px 14px;
    font-weight: 700;
    font-size: 12px;
}

.transaction-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    border-radius: 13px;
    background: #fafafa;
}

.transaction-left {
    display: flex;
    gap: 11px;
    align-items: center;
}

.transaction-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.transaction-name {
    font-weight: 700;
    font-size: 13px;
}

.transaction-date {
    font-size: 11px;
    color: var(--sub);
    margin-top: 3px;
}

.transaction-money {
    font-weight: 800;
}

.empty {
    text-align: center;
    color: var(--sub);
    padding: 25px;
    font-size: 13px;
}

/* =========================
   Modal
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(450px,100%);
    background: white;
    border-radius: 22px;
    padding: 23px;
    box-shadow: 0 20px 50px rgba(0,0,0,.18);
}

.modal-box h2 {
    margin-top: 0;
}

.form-group {
    margin-top: 14px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 6px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    background: white;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 11px;
    border: none;
    font-weight: 700;
}

.cancel {
    background: #eee;
}

.confirm {
    background: var(--primary);
    color: white;
}

/* =========================
   Toast
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: white;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 200;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   Responsive
========================= */

@media(max-width:900px) {
    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .main-grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:600px) {
    .app {
        width: min(100% - 20px, 600px);
    }

    .header {
        align-items: flex-start;
        gap: 10px;
    }

    .brand h1 {
        font-size: 24px;
    }

    .month-control {
        margin-top: 2px;
    }

    .summary-grid {
        grid-template-columns: 1fr 1fr;
    }

    .budget-card {
        grid-column: span 2;
    }

    .stat-card {
        min-height: 125px;
    }

    .day {
        min-height: 58px;
        padding: 5px;
    }

    .day-expense {
        font-size: 9px;
        margin-top: 7px;
    }

    .week-details {
        grid-template-columns: 1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">
        <div class="brand">
            <h1>週週記</h1>
            <p>把每個月的 $15,000 用得更剛好</p>
        </div>

        <div class="month-control">
            <button onclick="changeMonth(-1)">‹</button>
            <div class="month-title" id="monthTitle"></div>
            <button onclick="changeMonth(1)">›</button>
        </div>
    </header>


    <!-- 月度總覽 -->
    <section class="summary-grid">

        <div class="card budget-card">
            <div class="budget-top">
                <div>
                    <div class="label">本月固定預算</div>
                    <div class="amount">$15,000</div>
                </div>
                <div class="fixed-badge">固定預算</div>
            </div>

            <div class="progress">
                <div class="progress-fill" id="monthProgress"></div>
            </div>

            <div class="progress-info">
                <span id="spentPercent">已使用 0%</span>
                <span id="remainingText">$15,000 剩餘</span>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon blue">💸</div>
            <div>
                <div class="stat-number" id="monthSpent">$0</div>
                <div class="stat-desc">本月已支出</div>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon purple">🔮</div>
            <div>
                <div class="stat-number" id="futureTotal">$0</div>
                <div class="stat-desc">未來預留支出</div>
            </div>
        </div>

        <div class="card stat-card">
            <div class="stat-icon green">🏦</div>
            <div>
                <div class="stat-number" id="savingTotal">$0</div>
                <div class="stat-desc">本月預估存款</div>
            </div>
        </div>

    </section>


    <!-- 本週預算 -->
    <section class="section">

        <div class="section-title">
            <h2>📆 本週可以花多少？</h2>
            <span>以週為單位管理預算</span>
        </div>

        <div class="card week-card">

            <div class="week-header">
                <div>
                    <div class="week-name" id="currentWeekName">本週</div>
                    <div class="week-date" id="currentWeekDate"></div>
                </div>

                <div class="week-available">
                    <div class="small">本週剩餘可用</div>
                    <div class="big" id="weekAvailable">$0</div>
                </div>
            </div>

            <div class="week-progress">
                <div class="week-progress-fill" id="weekProgress"></div>
            </div>

            <div class="week-details">

                <div class="week-detail">
                    <span>本週預算</span>
                    <strong id="weekBudget">$0</strong>
                </div>

                <div class="week-detail">
                    <span>本週已花</span>
                    <strong id="weekSpent">$0</strong>
                </div>

                <div class="week-detail">
                    <span>預計存下</span>
                    <strong id="weekSaving">$0</strong>
                </div>

            </div>

        </div>

    </section>


    <!-- 主要區域 -->
    <div class="main-grid">

        <!-- 左側 -->
        <div>

            <!-- 日曆 -->
            <div class="card calendar-card">

                <div class="calendar-header">
                    <h2>📅 <span id="calendarTitle"></span></h2>
                    <button onclick="goToday()">回到今天</button>
                </div>

                <div class="calendar-weekdays">
                    <div>日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div>六</div>
                </div>

                <div class="calendar-grid" id="calendar"></div>

            </div>


            <!-- 週支出圖 -->
            <div class="card chart-card section">

                <div class="section-title">
                    <h2>📊 每週花費</h2>
                    <span>看哪一週花最多</span>
                </div>

                <div class="chart" id="weeklyChart"></div>

            </div>

        </div>


        <!-- 右側 -->
        <div>

            <!-- 未來預算 -->
            <div class="card future-card">

                <div class="section-title">
                    <h2>🔮 未來支出</h2>
                    <button class="add-btn" onclick="openFutureModal()">＋ 新增</button>
                </div>

                <div class="future-total">
                    <span>這些錢會先從本月預算保留下來</span>
                    <strong id="futureTotal2">$0</strong>
                </div>

                <div class="future-list" id="futureList"></div>

            </div>


            <!-- AI -->
            <div class="card ai-card">

                <div class="ai-title">
                    🤖 AI 預算建議
                </div>

                <div class="ai-content" id="aiAdvice">
                    正在分析你的預算狀況……
                </div>

            </div>

        </div>

    </div>


    <!-- 記帳 -->
    <section class="card transaction-card">

        <div class="section-title">
            <div>
                <h2>💳 最近支出</h2>
                <span>記錄每一筆花費</span>
            </div>

            <button class="add-btn" onclick="openExpenseModal()">
                ＋ 記一筆
            </button>
        </div>

        <div class="transaction-list" id="transactionList"></div>

    </section>

</div>


<!-- =========================
     支出 Modal
========================= -->

<div class="modal" id="expenseModal">

    <div class="modal-box">

        <h2>新增支出</h2>

        <div class="form-group">
            <label>日期</label>
            <input type="date" id="expenseDate">
        </div>

        <div class="form-group">
            <label>項目</label>
            <input type="text" id="expenseName" placeholder="例如：午餐、交通、購物">
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>金額</label>
                <input type="number" id="expenseAmount" placeholder="0">
            </div>

            <div class="form-group">
                <label>分類</label>
                <select id="expenseCategory">
                    <option value="🍜">飲食</option>
                    <option value="🚌">交通</option>
                    <option value="🛍️">購物</option>
                    <option value="🎮">娛樂</option>
                    <option value="📚">學習</option>
                    <option value="💊">生活</option>
                    <option value="📦">其他</option>
                </select>
            </div>

        </div>

        <div class="modal-actions">
            <button class="cancel" onclick="closeModal('expenseModal')">取消</button>
            <button class="confirm" onclick="addExpense()">新增</button>
        </div>

    </div>

</div>


<!-- =========================
     未來支出 Modal
========================= -->

<div class="modal" id="futureModal">

    <div class="modal-box">

        <h2>新增未來支出</h2>

        <div class="form-group">
            <label>日期</label>
            <input type="date" id="futureDate">
        </div>

        <div class="form-group">
            <label>預計用途</label>
            <input type="text" id="futureName" placeholder="例如：小琉球、聚餐、電影">
        </div>

        <div class="form-row">

            <div class="form-group">
                <label>預計金額</label>
                <input type="number" id="futureAmount" placeholder="0">
            </div>

            <div class="form-group">
                <label>圖示</label>
                <select id="futureIcon">
                    <option value="🧳">旅遊</option>
                    <option value="🍜">聚餐</option>
                    <option value="🛍️">購物</option>
                    <option value="🎬">娛樂</option>
                    <option value="🚌">交通</option>
                    <option value="📦">其他</option>
                </select>
            </div>

        </div>

        <div class="modal-actions">
            <button class="cancel" onclick="closeModal('futureModal')">取消</button>
            <button class="confirm" onclick="addFuture()">新增</button>
        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   週週記
   核心設定
===================================================== */

const MONTHLY_BUDGET = 15000;

let currentDate = new Date();

let data = JSON.parse(
    localStorage.getItem("weeklyNoteData") ||
    '{"expenses":[],"future":[],"savings":0}'
);


/* =====================================================
   工具
===================================================== */

function money(number) {
    return "$" + Math.round(number).toLocaleString("zh-TW");
}

function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,"0");
    const d = String(date.getDate()).padStart(2,"0");

    return `${y}-${m}-${d}`;
}

function monthKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
}

function saveData() {
    localStorage.setItem(
        "weeklyNoteData",
        JSON.stringify(data)
    );
}

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}


/* =====================================================
   月份資料
===================================================== */

function getMonthExpenses() {

    const key = monthKey(currentDate);

    return data.expenses.filter(
        x => x.date.startsWith(key)
    );
}

function getMonthFuture() {

    const key = monthKey(currentDate);

    return data.future.filter(
        x => x.date.startsWith(key)
    );
}

function getMonthSpent() {

    return getMonthExpenses()
        .reduce((sum,x) => sum + Number(x.amount),0);
}

function getFutureTotal() {

    return getMonthFuture()
        .reduce((sum,x) => sum + Number(x.amount),0);
}


/* =====================================================
   月份切換
===================================================== */

function changeMonth(offset) {

    currentDate.setMonth(
        currentDate.getMonth() + offset
    );

    render();
}

function goToday() {

    currentDate = new Date();

    render();
}


/* =====================================================
   日曆
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("calendarTitle").textContent =
        `${year} 年 ${month+1} 月`;

    const firstDay =
        new Date(year,month,1).getDay();

    const daysInMonth =
        new Date(year,month+1,0).getDate();

    for(let i=0;i<firstDay;i++) {

        const empty = document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);
    }

    for(let day=1;day<=daysInMonth;day++) {

        const date =
            new Date(year,month,day);

        const key = dateKey(date);

        const cell =
            document.createElement("div");

        cell.className = "day";

        const todayKey =
            dateKey(new Date());

        if(key === todayKey) {
            cell.classList.add("today");
        }

        const expenses =
            data.expenses.filter(
                x => x.date === key
            );

        const spent =
            expenses.reduce(
                (sum,x) => sum + Number(x.amount),
                0
            );

        const futures =
            data.future.filter(
                x => x.date === key
            );

        cell.innerHTML = `
            <div class="day-number">${day}</div>

            ${
                spent > 0
                ? `<div class="day-expense ${spent > 500 ? "high":""}">
                    ${money(spent)}
                   </div>`
                : ""
            }

            ${
                futures.length > 0
                ? `<div class="future-dot"
                        title="有未來預算">
                   </div>`
                : ""
            }
        `;

        cell.onclick = () => {

            if(expenses.length === 0) {

                showToast(`${month+1}/${day} 尚無支出`);

            } else {

                showToast(
                    `${month+1}/${day} 共花 ${money(spent)}`
                );
            }

        };

        calendar.appendChild(cell);
    }
}


/* =====================================================
   月度總覽
===================================================== */

function renderSummary() {

    const spent = getMonthSpent();
    const future = getFutureTotal();

    const available =
        Math.max(
            0,
            MONTHLY_BUDGET - spent - future
        );

    const percent =
        Math.min(
            100,
            (spent / MONTHLY_BUDGET) * 100
        );

    document.getElementById("monthSpent")
        .textContent = money(spent);

    document.getElementById("futureTotal")
        .textContent = money(future);

    document.getElementById("futureTotal2")
        .textContent = money(future);

    document.getElementById("monthProgress")
        .style.width = percent + "%";

    document.getElementById("spentPercent")
        .textContent =
        `已使用 ${Math.round(percent)}%`;

    document.getElementById("remainingText")
        .textContent =
        `${money(available)} 可自由分配`;
}


/* =====================================================
   週計算
===================================================== */

function getWeekRange(date) {

    const d = new Date(date);

    const day = d.getDay();

    const start =
        new Date(d);

    start.setDate(
        d.getDate() - day
    );

    start.setHours(0,0,0,0);

    const end =
        new Date(start);

    end.setDate(
        start.getDate()+6
    );

    end.setHours(23,59,59,999);

    return {start,end};
}


function getWeeksOfMonth() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const weeks = [];

    let date =
        new Date(year,month,1);

    while(date.getMonth() === month) {

        const range =
            getWeekRange(date);

        const start =
            new Date(
                Math.max(
                    range.start.getTime(),
                    new Date(year,month,1).getTime()
                )
            );

        const end =
            new Date(
                Math.min(
                    range.end.getTime(),
                    new Date(year,month+1,0,23,59,59,999).getTime()
                )
            );

        weeks.push({
            start,
            end
        });

        date =
            new Date(range.end);

        date.setDate(date.getDate()+1);
    }

    return weeks;
}


/*
    預算分配邏輯：

    月預算 15,000

    先扣：
    1. 已發生支出
    2. 未來預計支出

    剩餘的錢，再依「剩餘週數」
    平均分配到未來週。
*/

function getWeekBudgetForCurrentWeek() {

    const weeks =
        getWeeksOfMonth();

    const today =
        new Date();

    const monthExpenses =
        getMonthExpenses();

    const monthFuture =
        getMonthFuture();

    const totalFuture =
        monthFuture.reduce(
            (sum,x)=>sum+Number(x.amount),
            0
        );

    const currentIndex =
        weeks.findIndex(
            w =>
                today >= w.start &&
                today <= w.end
        );

    let index = currentIndex;

    if(index === -1) {

        index =
            weeks.findIndex(
                w =>
                    currentDate >= w.start &&
                    currentDate <= w.end
            );
    }

    if(index === -1) {
        index = 0;
    }

    /*
      已發生的花費不應再次分配。
    */

    const totalSpent =
        monthExpenses.reduce(
            (sum,x)=>sum+Number(x.amount),
            0
        );

    const remaining =
        Math.max(
            0,
            MONTHLY_BUDGET -
            totalSpent -
            totalFuture
        );

    const futureWeeks =
        Math.max(
            1,
            weeks.length - index
        );

    return remaining / futureWeeks;
}


function getCurrentWeekExpenses() {

    const range =
        getWeekRange(new Date());

    return data.expenses.filter(x => {

        const d =
            new Date(x.date);

        return d >= range.start &&
               d <= range.end &&
               d.getMonth() === currentDate.getMonth();
    });
}


function renderWeek() {

    const today =
        new Date();

    const range =
        getWeekRange(today);

    const weekExpenses =
        getCurrentWeekExpenses();

    const spent =
        weekExpenses.reduce(
            (sum,x)=>sum+Number(x.amount),
            0
        );

    const budget =
        getWeekBudgetForCurrentWeek();

    const available =
        Math.max(
            0,
            budget - spent
        );

    const percent =
        budget === 0
        ? 0
        : Math.min(
            100,
            spent / budget * 100
        );

    document.getElementById("currentWeekName")
        .textContent = "本週預算";

    document.getElementById("currentWeekDate")
        .textContent =
        `${range.start.getMonth()+1}/${range.start.getDate()} ～ ${range.end.getMonth()+1}/${range.end.getDate()}`;

    document.getElementById("weekAvailable")
        .textContent = money(available);

    document.getElementById("weekBudget")
        .textContent = money(budget);

    document.getElementById("weekSpent")
        .textContent = money(spent);

    document.getElementById("weekSaving")
        .textContent = money(available);

    document.getElementById("weekProgress")
        .style.width = percent + "%";
}


/* =====================================================
   未來支出
===================================================== */

function renderFuture() {

    const list =
        document.getElementById("futureList");

    list.innerHTML = "";

    const future =
        getMonthFuture()
        .sort(
            (a,b) =>
            new Date(a.date) -
            new Date(b.date)
        );

    if(future.length === 0) {

        list.innerHTML =
            `<div class="empty">
                還沒有未來支出 🎉<br>
                可以先把旅遊、聚餐等預算加進來
             </div>`;

        return;
    }

    future.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "future-item";

        div.innerHTML = `

            <div class="future-left">

                <div class="future-icon">
                    ${item.icon}
                </div>

                <div>
                    <div class="future-title">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="future-date">
                        ${item.date}
                    </div>
                </div>

            </div>

            <div>
                <span class="future-money">
                    ${money(item.amount)}
                </span>

                <button
                    class="delete-btn"
                    onclick="deleteFuture('${item.id}')">
                    ×
                </button>
            </div>
        `;

        list.appendChild(div);
    });
}


/* =====================================================
   每週圖表
===================================================== */

function renderWeeklyChart() {

    const chart =
        document.getElementById("weeklyChart");

    chart.innerHTML = "";

    const weeks =
        getWeeksOfMonth();

    const values =
        weeks.map((week,index)=>{

            return data.expenses
                .filter(x=>{

                    const d =
                        new Date(x.date);

                    return d >= week.start &&
                           d <= week.end &&
                           d.getMonth() === currentDate.getMonth();

                })
                .reduce(
                    (sum,x)=>sum+Number(x.amount),
                    0
                );
        });

    const max =
        Math.max(
            100,
            ...values
        );

    values.forEach((value,index)=>{

        const wrap =
            document.createElement("div");

        wrap.className =
            "bar-wrap";

        const height =
            Math.max(
                3,
                value / max * 160
            );

        wrap.innerHTML = `

            <div class="bar-value">
                ${value > 0 ? "$"+Math.round(value) : ""}
            </div>

            <div class="bar"
                 style="height:${height}px">
            </div>

            <div class="bar-label">
                第${index+1}週
            </div>
        `;

        chart.appendChild(wrap);
    });
}


/* =====================================================
   AI 建議
===================================================== */

function renderAI() {

    const advice =
        document.getElementById("aiAdvice");

    const spent =
        getMonthSpent();

    const future =
        getFutureTotal();

    const today =
        new Date();

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const days =
        new Date(
            year,
            month+1,
            0
        ).getDate();

    const currentDay =
        today.getMonth() === month
        ? today.getDate()
        : 1;

    const remainingDays =
        Math.max(
            1,
            days-currentDay+1
        );

    const available =
        Math.max(
            0,
            MONTHLY_BUDGET -
            spent -
            future
        );

    const daily =
        available / remainingDays;

    let status = "";

    if(available <= 0) {

        status = `
            🔴 <strong>目前預算已經非常緊繃。</strong>
            未來支出已經幾乎吃掉本月剩餘預算，
            建議暫停非必要消費。
        `;

    } else if(daily < 250) {

        status = `
            🟡 目前預算需要稍微注意。
            扣除未來預支出後，
            接下來平均每天約可使用
            <span class="ai-highlight">${money(daily)}</span>。
        `;

    } else {

        status = `
            🟢 目前預算狀況良好。
            扣除未來支出後，
            接下來平均每天約可使用
            <span class="ai-highlight">${money(daily)}</span>。
        `;
    }

    advice.innerHTML = status;
}


/* =====================================================
   記帳列表
===================================================== */

function renderTransactions() {

    const list =
        document.getElementById("transactionList");

    list.innerHTML = "";

    const expenses =
        getMonthExpenses()
        .sort(
            (a,b) =>
            new Date(b.date) -
            new Date(a.date)
        );

    if(expenses.length === 0) {

        list.innerHTML =
            `<div class="empty">
                本月還沒有記帳紀錄 ✨
             </div>`;

        return;
    }

    expenses.slice(0,20)
        .forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "transaction";

        div.innerHTML = `

            <div class="transaction-left">

                <div class="transaction-icon">
                    ${item.category}
                </div>

                <div>

                    <div class="transaction-name">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="transaction-date">
                        ${item.date}
                    </div>

                </div>

            </div>

            <div>
                <span class="transaction-money">
                    -${money(item.amount)}
                </span>

                <button
                    class="delete-btn"
                    onclick="deleteExpense('${item.id}')">
                    ×
                </button>
            </div>
        `;

        list.appendChild(div);

    });
}


/* =====================================================
   新增支出
===================================================== */

function openExpenseModal() {

    document.getElementById("expenseModal")
        .classList.add("show");

    document.getElementById("expenseDate")
        .value = dateKey(new Date());
}

function addExpense() {

    const date =
        document.getElementById("expenseDate").value;

    const name =
        document.getElementById("expenseName").value.trim();

    const amount =
        Number(
            document.getElementById("expenseAmount").value
        );

    const category =
        document.getElementById("expenseCategory").value;

    if(!date || !name || amount <= 0) {

        showToast("請完整填寫資料");

        return;
    }

    data.expenses.push({

        id:
            Date.now().toString(),

        date,

        name,

        amount,

        category
    });

    saveData();

    closeModal("expenseModal");

    document.getElementById("expenseName").value = "";

    document.getElementById("expenseAmount").value = "";

    showToast("已新增支出");

    render();
}


/* =====================================================
   刪除支出
===================================================== */

function deleteExpense(id) {

    data.expenses =
        data.expenses.filter(
            x => x.id !== id
        );

    saveData();

    showToast("已刪除支出");

    render();
}


/* =====================================================
   未來支出
===================================================== */

function openFutureModal() {

    document.getElementById("futureModal")
        .classList.add("show");

    document.getElementById("futureDate")
        .value = dateKey(
            new Date()
        );
}

function addFuture() {

    const date =
        document.getElementById("futureDate").value;

    const name =
        document.getElementById("futureName").value.trim();

    const amount =
        Number(
            document.getElementById("futureAmount").value
        );

    const icon =
        document.getElementById("futureIcon").value;

    if(!date || !name || amount <= 0) {

        showToast("請完整填寫資料");

        return;
    }

    data.future.push({

        id:
            Date.now().toString(),

        date,

        name,

        amount,

        icon
    });

    saveData();

    closeModal("futureModal");

    document.getElementById("futureName").value = "";

    document.getElementById("futureAmount").value = "";

    showToast("已加入未來預算");

    render();
}


/* =====================================================
   刪除未來支出
===================================================== */

function deleteFuture(id) {

    data.future =
        data.future.filter(
            x => x.id !== id
        );

    saveData();

    showToast("已刪除未來支出");

    render();
}


/* =====================================================
   Modal
===================================================== */

function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("show");
}

document.querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            e => {

                if(e.target === modal) {

                    modal.classList.remove("show");

                }

            }
        );

    });


/* =====================================================
   HTML 安全處理
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   主畫面
===================================================== */

function render() {

    document.getElementById("monthTitle")
        .textContent =
        `${currentDate.getFullYear()} 年 ${currentDate.getMonth()+1} 月`;

    renderSummary();

    renderWeek();

    renderCalendar();

    renderWeeklyChart();

    renderFuture();

    renderTransactions();

    renderAI();
}


/* =====================================================
   初始化
===================================================== */

render();

</script>
