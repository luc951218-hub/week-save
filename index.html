<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週週記 - 個人記帳與預算管理</title>

<style>
:root {
    --primary: #007aff;
    --primary-light: #eaf4ff;
    --success: #34c759;
    --danger: #ff3b30;
    --warning: #ff9500;
    --purple: #af52de;

    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --border: #e5e5ea;

    --shadow: 0 4px 16px rgba(0,0,0,0.05);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   Layout
========================= */

.app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 18px 100px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.logo h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -1px;
}

.logo p {
    margin: 5px 0 0;
    color: var(--sub);
    font-size: 13px;
}

.month-selector {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    color: var(--text);
}

/* =========================
   Navigation
========================= */

.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 20px;
    padding-bottom: 2px;
}

.tab {
    border: none;
    background: #e9e9ee;
    color: #555;
    padding: 10px 16px;
    border-radius: 12px;
    white-space: nowrap;
}

.tab.active {
    background: var(--primary);
    color: white;
}

/* =========================
   Cards
========================= */

.card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
}

.grid {
    display: grid;
    gap: 14px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

/* =========================
   Summary
========================= */

.summary-card {
    padding: 18px;
}

.summary-label {
    font-size: 13px;
    color: var(--sub);
}

.summary-value {
    font-size: 25px;
    font-weight: 700;
    margin-top: 7px;
}

.summary-value.primary {
    color: var(--primary);
}

.summary-value.success {
    color: var(--success);
}

.summary-value.danger {
    color: var(--danger);
}

.summary-value.warning {
    color: var(--warning);
}

/* =========================
   Progress
========================= */

.progress {
    height: 9px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width .3s;
}

.progress-fill.danger {
    background: var(--danger);
}

.progress-fill.success {
    background: var(--success);
}

.progress-fill.warning {
    background: var(--warning);
}

/* =========================
   Today Plan
========================= */

.today-plan-card {
    background: #ffffff;
    border: 0.5px solid rgba(0,122,255,.2);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
}

.today-plan-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
}

.today-plan-item {
    background: #f8f8fa;
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 8px;
    border: 0.5px solid rgba(0,0,0,.04);
}

.today-plan-item .item-title {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}

.today-plan-item .item-status {
    font-size: 12px;
    color: var(--sub);
    display: flex;
    justify-content: space-between;
}

.status-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}

.status-badge.ok {
    background: #e1f8eb;
    color: #34c759;
}

.status-badge.over {
    background: #ffe5e5;
    color: #ff3b30;
}

.status-badge.warning {
    background: #fff3dc;
    color: #ff9500;
}

/* =========================
   AI
========================= */

.ai-card {
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
    border: 1px solid #bbdefb;
}

.ai-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    margin-bottom: 12px;
}

.ai-content {
    line-height: 1.7;
    font-size: 14px;
}

.ai-item {
    background: rgba(255,255,255,.75);
    padding: 11px 12px;
    border-radius: 12px;
    margin-top: 8px;
}

/* =========================
   Forms
========================= */

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    border: 1px solid var(--border);
    background: #fff;
    padding: 11px 12px;
    border-radius: 11px;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--primary);
}

.btn {
    border: none;
    border-radius: 12px;
    padding: 11px 16px;
    transition: .2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.btn-secondary {
    background: #e9e9ee;
    color: var(--text);
}

.btn:hover {
    opacity: .85;
}

.form-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}

/* =========================
   Transaction List
========================= */

.transaction {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 11px;
}

.transaction-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
}

.transaction-name {
    font-weight: 600;
    font-size: 14px;
}

.transaction-date {
    font-size: 11px;
    color: var(--sub);
    margin-top: 3px;
}

.transaction-amount {
    font-weight: 700;
}

.income {
    color: var(--success);
}

.expense {
    color: var(--danger);
}

.delete-btn {
    margin-left: 8px;
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 15px;
}

/* =========================
   Trip
========================= */

.trip-card {
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 12px;
}

.trip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.trip-name {
    font-size: 16px;
    font-weight: 700;
}

.trip-date {
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
}

.trip-budget {
    color: var(--primary);
    font-weight: 700;
}

.trip-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    margin-top: 14px;
}

.trip-detail {
    background: #f7f7f9;

    padding: 9px;
}

.trip-detail span {
    display: block;
    font-size: 11px;
    color: var(--sub);
}

.trip-detail strong {
    display: block;
    margin-top: 4px;
    font-size: 13px;
}

/* =========================
   Alert
========================= */

.alert {
    padding: 13px 15px;
    border-radius: 13px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.6;
}

.alert-success {
    background: #eaf8ef;
    color: #227a40;
}

.alert-warning {
    background: #fff4df;
    color: #9a5c00;
}

.alert-danger {
    background: #ffeaea;
    color: #b42318;
}

.alert-info {
    background: #eaf4ff;
    color: #135fa8;
}

/* =========================
   Table
========================= */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 11px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

th {
    color: var(--sub);
    font-weight: 500;
}

/* =========================
   Modal
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 20px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.close {
    border: none;
    background: #eeeef2;
    width: 34px;
    height: 34px;
    border-radius: 50%;
}

/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    color: var(--sub);
    padding: 35px 15px;
    font-size: 13px;
}

/* =========================
   Mobile
========================= */

@media (max-width: 700px) {

    .app {
        padding: 18px 12px 80px;
    }

    .header {
        align-items: flex-start;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
        grid-template-columns: 1fr 1fr;
    }

    .trip-details {
        grid-template-columns: 1fr 1fr;
    }

    .summary-value {
        font-size: 21px;
    }
}

@media (max-width: 450px) {

    .grid-2,

    }

    .header {

    }

    .month-selector {
        width: 100%;
    }

    .form-actions {
        flex-direction: column;
    }

    .form-actions button {
        width: 100%;
    }
}
</style>
</head>

<div class="app">

    <!-- Header -->
    <header class="header">

<script>

/* =========================================================
   週週記 - 資料系統
========================================================= */

const STORAGE_KEY = "weeklyDiaryData_v1";

let data = loadData();

let currentMonth =
    new Date().toISOString().slice(0, 7);


/* =========================================================
   初始資料
========================================================= */

function createDefaultData() {

    return {
        transactions: [],
        budgets: {},
        trips: []
    };

}


/* =========================================================
   LocalStorage
========================================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return createDefaultData();
        }

        const parsed = JSON.parse(saved);

        return {
            transactions:
                parsed.transactions || [],

            budgets:
                parsed.budgets || {},

            trips:
                parsed.trips || []
        };

    } catch (error) {

        console.error(error);

        return createDefaultData();

    }

}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   Utility
========================================================= */

function money(value) {

    return "$" +
        Math.round(Number(value || 0))
        .toLocaleString("zh-TW");

}


function formatDate(date) {

    if (!date) return "";

    return date.replaceAll("-", "/");

}


function todayString() {

    const d = new Date();

    const y =
        d.getFullYear();

    const m =
        String(d.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(d.getDate())
        .padStart(2, "0");

    return `${y}-${m}-${day}`;

}


function monthOf(date) {

    return String(date).slice(0, 7);

}


function daysInMonth(month) {

    const [year, mon] =
        month.split("-").map(Number);

    return new Date(
        year,
        mon,
        0
    ).getDate();

}


function daysPassed(month) {

    const today = new Date();

    const target =
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1)
            .padStart(2, "0");

    if (month !== target) {

        return daysInMonth(month);

    }

    return today.getDate();

}


/* =========================================================
   Budget
========================================================= */

function getMonthlyBudget(month = currentMonth) {

    return Number(
        data.budgets[month] || 0
    );

}


function getMonthTransactions(month = currentMonth) {

    return data.transactions.filter(
        item => monthOf(item.date) === month
    );

}


function getMonthIncome(month = currentMonth) {

    return getMonthTransactions(month)
        .filter(x => x.type === "income")
        .reduce(
            (sum, x) =>
                sum + Number(x.amount),
            0
        );

}


function getMonthExpense(month = currentMonth) {

    return getMonthTransactions(month)
        .filter(x => x.type === "expense")
        .reduce(
            (sum, x) =>
                sum + Number(x.amount),
            0
        );

}


/* =========================================================
   Future Trip
========================================================= */

function getMonthTrips(month = currentMonth) {

    return data.trips.filter(trip => {

        return monthOf(trip.start) === month ||
               monthOf(trip.end) === month;

    });

}


function getTripTotal(trip) {

    return (
        Number(trip.transport || 0) +
        Number(trip.food || 0) +
        Number(trip.entertainment || 0) +
        Number(trip.other || 0)
    );

}


function getTripReserve(month = currentMonth) {

    return getMonthTrips(month)
        .reduce(
            (sum, trip) =>
                sum + getTripTotal(trip),
            0
        );

}


/* =========================================================
   Real available budget
========================================================= */

function getRemainingBudget(month = currentMonth) {

    const budget =
        getMonthlyBudget(month);

    const expense =
        getMonthExpense(month);

    const tripReserve =
        getTripReserve(month);

    /*
       核心邏輯：

       本月總預算
       - 已經花掉的
       - 未來行程預留
       = 真正可以自由使用的錢
    */

    return Math.max(
        0,
        budget -
        expense -
        tripReserve
    );

}


/* =========================================================
   Daily budget
========================================================= */

function getTodayActualExpense() {

    const today =
        todayString();

    return data.transactions
        .filter(x =>
            x.date === today &&
            x.type === "expense"
        )
        .reduce(
            (sum, x) =>
                sum + Number(x.amount),
            0
        );

}


function getDailyAvailable() {

    const remaining =
        getRemainingBudget();

    const passed =
        daysPassed(currentMonth);

    const totalDays =
        daysInMonth(currentMonth);

    const remainingDays =
        Math.max(
            1,
            totalDays - passed + 1
        );

    return remaining /
        remainingDays;

}

   Render Home

function renderHome() {

    const expense =

    const tripReserve =
        getTripReserve();

        getTodayActualExpense();

    const daily =
        getDailyAvailable();


    document.getElementById(
        "summaryIncome"
    ).textContent =
        money(income);


    document.getElementById(
        "summaryExpense"
    ).textContent =
        money(expense);


    document.getElementById(
        "summaryRemaining"
    ).textContent =
        money(remaining);


    document.getElementById(
        "summaryToday"
    ).textContent =
        money(
            Math.max(
                0,
                daily - todayActual
            )
        );


    document.getElementById(
        "homeBudget"
    ).textContent =
        money(budget);


    document.getElementById(
        "homeUsed"
    ).textContent =
        money(expense);


    document.getElementById(
        "homeTripReserve"
    ).textContent =
        money(tripReserve);


    const progress =
        budget > 0
        ? Math.min(
            100,
            ((expense + tripReserve) /
                budget) * 100
        )
        : 0;


    const progressElement =
        document.getElementById(
            "homeProgress"
        );

    progressElement.style.width =
        progress + "%";


    progressElement.className =
        "progress-fill " +
        (
            progress >= 90
            ? "danger"
            : progress >= 70
            ? "warning"
            : ""
        );


    let status = "";

    if (budget <= 0) {

        status =
            "尚未設定本月預算。";

    } else if (
        expense + tripReserve > budget
    ) {

        status =
            "⚠️ 目前支出加上未來行程已超過本月預算。";

    } else {

        status =
            `目前已使用 ${Math.round(progress)}%，`
            + `還有 ${money(remaining)} 可以自由安排。`;

    }

    document.getElementById(
        "budgetStatusText"
    ).textContent =
        status;


    renderTodayPlan();
    renderTripImpact();
    renderAI();
    renderRecentTransactions();

}


/* =========================================================
   Today Plan
========================================================= */

function renderTodayPlan() {

    const actual =
        getTodayActualExpense();

    const daily =
        getDailyAvailable();

    const remaining =
        Math.max(
            0,
            daily - actual
        );

    const percentage =
        daily > 0
        ? (actual / daily) * 100
        : 0;


    let badge = "";
    let message = "";

    if (actual > daily) {

        badge =
            `<span class="status-badge over">
                已超支
             </span>`;

        message =
            `今天已多花 ${money(actual - daily)}。`;

    } else if (percentage >= 80) {

        badge =
            `<span class="status-badge warning">
                接近上限
             </span>`;

        message =
            `今天建議剩餘支出控制在 ${money(remaining)} 內。`;

    } else {

        badge =
            `<span class="status-badge ok">
                正常
             </span>`;

        message =
            `今天還可以安心使用 ${money(remaining)}。`;

    }


    document.getElementById(
        "todayDate"
    ).textContent =
        todayString().replaceAll("-", "/");


    document.getElementById(
        "todayPlanContent"
    ).innerHTML = `

        <div class="today-plan-item">

            <div class="item-title">
                <span>今日建議額度</span>
                <span>${money(daily)}</span>
            </div>

            <div class="item-status">
                <span>今天已花 ${money(actual)}</span>
                ${badge}
            </div>

        </div>

        <div class="today-plan-item">

            <div class="item-title">
                <span>今天剩餘</span>
                <span>${money(remaining)}</span>
            </div>

            <div class="item-status">
                <span>${message}</span>
            </div>

        </div>
    `;

}


/* =========================================================
   Trip Impact
========================================================= */

function renderTripImpact() {

    const trips =
        getMonthTrips();

    const container =
        document.getElementById(
            "tripImpact"
        );

    if (!trips.length) {

        container.innerHTML = `
            <div class="empty">
                目前沒有設定未來行程。
            </div>
        `;

        return;

    }


    const reserve =
        getTripReserve();

    const remainingBeforeTrip =
        getMonthlyBudget() -
        getMonthExpense();


    container.innerHTML = `

        <div class="alert ${
            reserve > remainingBeforeTrip
            ? "alert-danger"
            : "alert-info"
        }">

            未來行程預計需要
            <strong>${money(reserve)}</strong>。

            <br>

            扣除目前支出後，
            本月原本還有
            <strong>${money(
                Math.max(
                    0,
                    remainingBeforeTrip
                )
            )}</strong>。

            <br>

            ${
                reserve > remainingBeforeTrip
                ? "⚠️ 未來行程預算可能不足，建議調整支出。"
                : "✓ 已先替未來行程保留預算，避免現在不小心花掉。"
            }

        </div>
    `;

}


/* =========================================================
   AI Advice
========================================================= */

function renderAI() {

    const budget =
        getMonthlyBudget();

    const expense =
        getMonthExpense();

    const trips =
        getTripReserve();

    const remaining =
        getRemainingBudget();

    const daily =
        getDailyAvailable();

    const today =
        getTodayActualExpense();


    let html = "";


    if (budget <= 0) {

        html += `
            <div class="ai-item">
                💡 建議先設定本月生活預算，
                系統才能幫你計算每天可以使用多少錢。
            </div>
        `;

    } else {

        const usage =
            ((expense + trips) /
                budget) * 100;


        if (usage >= 100) {

            html += `
                <div class="ai-item">
                    🚨 目前本月支出加上未來行程已超過預算，
                    建議優先降低非必要消費。
                </div>
            `;

        } else if (usage >= 80) {

            html += `
                <div class="ai-item">
                    ⚠️ 本月預算使用率已達
                    ${Math.round(usage)}%，
                    接下來可以稍微控制購物與娛樂支出。
                </div>
            `;

        } else {

            html += `
                <div class="ai-item">
                    ✓ 目前預算狀況穩定，
                    加上未來行程預留後，
                    還有 ${money(remaining)} 可以安排。
                </div>
            `;

        }


        html += `
            <div class="ai-item">
                📅 以目前剩餘天數計算，
                每天平均約可使用
                <strong>${money(daily)}</strong>。
            </div>
        `;


        if (today > daily) {

            html += `
                <div class="ai-item">
                    🔴 今天已超過建議額度
                    ${money(today - daily)}，
                    明天可以稍微降低支出。
                </div>
            `;

        } else {

            html += `
                <div class="ai-item">
                    🟢 今天目前花費
                    ${money(today)}，
                    還在建議範圍內。
                </div>
            `;

        }


        if (trips > 0) {

            html += `
                <div class="ai-item">
                    ✈️ 已經替未來行程保留
                    ${money(trips)}，
                    因此現在的「可自由使用預算」
                    不會把這筆錢算進去。
                </div>
            `;

        }

    }


    document.getElementById(
        "aiAdvice"
    ).innerHTML =
        html;

}

        .replaceAll('"', "&quot;")
