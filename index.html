<script>
    /* =========================================================
       週週存｜核心預算設定
       ========================================================= */

    const MONTHLY_TOTAL = 15000;      // 每月總預算
    const RESERVE_BUDGET = 1000;      // 每月預備金
    const WEEKLY_AVAILABLE = MONTHLY_TOTAL - RESERVE_BUDGET; // 14000

    /*
     * 預算規則：
     * 1. 每月總預算固定 15,000
     * 2. 其中 1,000 為獨立預備金
     * 3. 剩餘 14,000 分配到當月各週
     * 4. 每週剩餘不帶到下一週
     * 5. 每週剩餘會自動視為存入金額
     */


    /* =========================================================
       State
       ========================================================= */

    let state = JSON.parse(localStorage.getItem('week_save_state')) || {
        transactions: [],
        plannedExpenses: [],
        savingsRecords: [],
        totalSavings: 0,
        reserveSpent: 0,
        settledWeeks: []
    };

    // 舊資料相容
    if (!state.transactions) state.transactions = [];
    if (!state.plannedExpenses) state.plannedExpenses = [];
    if (!state.savingsRecords) state.savingsRecords = [];
    if (!state.totalSavings) state.totalSavings = 0;
    if (!state.reserveSpent) state.reserveSpent = 0;
    if (!state.settledWeeks) state.settledWeeks = [];

    state.plannedExpenses.forEach(plan => {

        if (!plan.items) {
            plan.items = [];
        }

        if (plan.expanded === undefined) {
            plan.expanded = false;
        }

        /*
         * 舊資料沒有 category 時，
         * 依照細項名稱自動判斷
         */
        plan.items.forEach(item => {
            if (!item.category) {
                item.category = guessPlanCategory(item.name);
            }
        });
    });


    /* =========================================================
       日期
       ========================================================= */

    function getTodayStr() {
        const now = new Date();

        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    const todayStr = getTodayStr();

    document.getElementById('txDate').value = todayStr;
    document.getElementById('planDate').value = todayStr;

    let selectedCalDate = todayStr;


    /* =========================================================
       LocalStorage
       ========================================================= */

    function saveState() {
        localStorage.setItem(
            'week_save_state',
            JSON.stringify(state)
        );
    }


    /* =========================================================
       月份 / 週期
       ========================================================= */

    function getWeeksInMonth(date = new Date()) {

        const year = date.getFullYear();
        const month = date.getMonth();

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const usedDays =
            firstDay.getDay() +
            lastDay.getDate();

        return Math.ceil(usedDays / 7);
    }


    /*
     * 取得指定月份的「週一～週日」週期
     *
     * 注意：
     * 這裡仍維持你的原本設計，
     * 每個月依當月包含幾個週期來分配。
     */
    function getWeeklyTarget() {

        const weeks = getWeeksInMonth();

        return Math.floor(
            WEEKLY_AVAILABLE / weeks
        );
    }


    function getWeekRange(date = new Date()) {

        const dayOfWeek =
            date.getDay() === 0
                ? 7
                : date.getDay();

        const monday = new Date(date);

        monday.setDate(
            date.getDate() - (dayOfWeek - 1)
        );

        monday.setHours(0, 0, 0, 0);


        const sunday = new Date(date);

        sunday.setDate(
            date.getDate() + (7 - dayOfWeek)
        );

        sunday.setHours(23, 59, 59, 999);


        return {
            monday,
            sunday
        };
    }


    function getWeekKey(date = new Date()) {

        const { monday } = getWeekRange(date);

        return `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
    }


    function getWeekRangeText() {

        const { monday, sunday } =
            getWeekRange();

        return `
            本週區間：
            ${monday.getMonth() + 1}/${monday.getDate()} (一)
            -
            ${sunday.getMonth() + 1}/${sunday.getDate()} (日)
        `;
    }


    function isDateInCurrentWeek(dateStr) {

        const d = new Date(dateStr);

        const {
            monday,
            sunday
        } = getWeekRange();

        return d >= monday && d <= sunday;
    }


    function getMonthKey(dateStr) {

        const d = new Date(dateStr);

        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }


    function isSameMonth(dateStr, date = new Date()) {

        const d = new Date(dateStr);

        return (
            d.getFullYear() === date.getFullYear() &&
            d.getMonth() === date.getMonth()
        );
    }


    /* =========================================================
       分類判斷
       ========================================================= */

    function guessPlanCategory(name) {

        const text = String(name).toLowerCase();

        if (
            text.includes('車') ||
            text.includes('交通') ||
            text.includes('火車') ||
            text.includes('公車') ||
            text.includes('捷運') ||
            text.includes('高鐵') ||
            text.includes('船') ||
            text.includes('機票') ||
            text.includes('計程車') ||
            text.includes('uber')
        ) {
            return '🚗 交通';
        }

        if (
            text.includes('吃') ||
            text.includes('餐') ||
            text.includes('午餐') ||
            text.includes('晚餐') ||
            text.includes('早餐')
        ) {
            return '🍚 餐飲';
        }

        if (
            text.includes('飲料') ||
            text.includes('咖啡') ||
            text.includes('飲品')
        ) {
            return '☕ 飲料';
        }

        if (
            text.includes('買') ||
            text.includes('購物') ||
            text.includes('伴手禮')
        ) {
            return '🛍️ 購物';
        }

        if (
            text.includes('門票') ||
            text.includes('遊樂') ||
            text.includes('娛樂')
        ) {
            return '🎮 娛樂';
        }

        return '📦 其他';
    }


    /* =========================================================
       頁面切換
       ========================================================= */

    function switchPage(pageId, element) {

        document
            .querySelectorAll('.page')
            .forEach(p => p.classList.remove('active'));

        document
            .querySelectorAll('.nav-item')
            .forEach(n => n.classList.remove('active'));

        document
            .getElementById(`page-${pageId}`)
            .classList.add('active');

        element.classList.add('active');

        render();
    }


    /* =========================================================
       每週實際支出
       ========================================================= */

    function getWeeklySpent() {

        return state.transactions
            .filter(t =>
                t.type === 'weekly' &&
                isDateInCurrentWeek(t.date)
            )
            .reduce(
                (sum, t) => sum + Number(t.amount || 0),
                0
            );
    }


    /* =========================================================
       活動預算
       ========================================================= */

    function getPlanTotalAmount(plan) {

        if (plan.items && plan.items.length > 0) {

            return plan.items.reduce(
                (sum, item) =>
                    sum + (parseFloat(item.amount) || 0),
                0
            );
        }

        return Number(plan.amount || 0);
    }


    /*
     * 本週未來活動預留
     */
    function getWeeklyPlannedReserved() {

        return state.plannedExpenses
            .filter(p =>
                isDateInCurrentWeek(p.date) &&
                !p.completed
            )
            .reduce(
                (sum, p) =>
                    sum + getPlanTotalAmount(p),
                0
            );
    }


    /*
     * 本月未來活動總預算
     *
     * 這是這次 AI 判斷最重要的資料。
     */
    function getMonthlyFuturePlanTotal() {

        return state.plannedExpenses
            .filter(p =>
                isSameMonth(p.date) &&
                !p.completed
            )
            .reduce(
                (sum, p) =>
                    sum + getPlanTotalAmount(p),
                0
            );
    }


    /*
     * 未來出遊預算
     *
     * 排除本週已經實際完成的活動。
     */
    function getFuturePlans() {

        const today = getTodayStr();

        return state.plannedExpenses
            .filter(p =>
                p.date >= today &&
                !p.completed
            )
            .sort(
                (a, b) =>
                    new Date(a.date) -
                    new Date(b.date)
            );
    }


    /* =========================================================
       活動實際花費
       ========================================================= */

    /*
     * 判斷某筆實際支出是否可以對應到活動細項
     *
     * 主要依：
     * 1. 日期
     * 2. 分類
     */
    function getPlanItemActualSpent(plan, item) {

        if (!plan || !item) {
            return 0;
        }

        const category =
            item.category ||
            guessPlanCategory(item.name);

        return state.transactions
            .filter(t =>
                t.date === plan.date &&
                t.type === 'weekly' &&
                t.category === category
            )
            .reduce(
                (sum, t) =>
                    sum + Number(t.amount || 0),
                0
            );
    }


    /*
     * 活動當天實際花費
     */
    function getPlanActualSpent(plan) {

        return state.transactions
            .filter(t =>
                t.date === plan.date &&
                t.type === 'weekly'
            )
            .reduce(
                (sum, t) =>
                    sum + Number(t.amount || 0),
                0
            );
    }


    /*
     * 活動剩餘預算
     */
    function getPlanRemaining(plan) {

        const planned =
            getPlanTotalAmount(plan);

        const actual =
            getPlanActualSpent(plan);

        return planned - actual;
    }


    /* =========================================================
       新增一般記帳
       ========================================================= */

    function addTransaction() {

        const date =
            document.getElementById('txDate').value;

        const payment =
            document.getElementById('txPayment').value;

        const amount =
            parseFloat(
                document.getElementById('txAmount').value
            );

        const category =
            document.getElementById('txCategory').value;

        const note =
            document
                .getElementById('txNote')
                .value
                .trim();

        const type =
            document.getElementById('txType').value;


        if (!date) {
            alert('請選擇日期！');
            return;
        }


        if (isNaN(amount) || amount <= 0) {
            alert('請輸入有效金額！');
            return;
        }


        if (
            type === 'reserve' &&
            state.reserveSpent + amount > RESERVE_BUDGET
        ) {
            alert('緊急預備金餘額不足！');
            return;
        }


        state.transactions.push({

            id: Date.now(),

            type,

            payment:
                payment || '💵 現金',

            amount,

            category,

            note,

            date

        });


        if (type === 'reserve') {

            state.reserveSpent += amount;
        }


        saveState();


        document.getElementById('txAmount').value = '';
        document.getElementById('txNote').value = '';


        /*
         * 如果這筆支出是在未來活動當天，
         * 立即提醒是否超支。
         */
        const plans =
            state.plannedExpenses.filter(
                p => p.date === date
            );

        if (plans.length > 0) {

            plans.forEach(plan => {

                const remaining =
                    getPlanRemaining(plan);

                if (remaining < 0) {

                    alert(
                        `⚠️ ${plan.title} 已超支 NT$ ${Math.abs(remaining).toLocaleString()}！`
                    );
                }
            });
        }


        switchPage(
            'home',
            document.querySelectorAll('.nav-item')[0]
        );
    }


    /* =========================================================
       新增未來活動
       ========================================================= */

    function addPlannedExpense() {

        const date =
            document.getElementById('planDate').value;

        const title =
            document
                .getElementById('planTitle')
                .value
                .trim();


        if (!date) {
            alert('請選擇預計日期！');
            return;
        }


        if (!title) {
            alert('請輸入活動名稱或主題！');
            return;
        }


        state.plannedExpenses.push({

            id: Date.now(),

            date,

            title,

            amount: 0,

            items: [],

            expanded: true,

            completed: false

        });


        saveState();


        document.getElementById('planTitle').value = '';


        alert(
            '✅ 活動已建立！請在下方新增交通、餐飲、門票等細項預算。'
        );


        render();
    }


    /* =========================================================
       新增活動細項
       ========================================================= */

    function addSubItem(planId) {

        const nameInput =
            document.getElementById(
                `subName_${planId}`
            );

        const amountInput =
            document.getElementById(
                `subAmount_${planId}`
            );

        const categoryInput =
            document.getElementById(
                `subCategory_${planId}`
            );


        const name =
            nameInput.value.trim();

        const amount =
            parseFloat(amountInput.value);

        const category =
            categoryInput
                ? categoryInput.value
                : guessPlanCategory(name);


        if (!name) {

            alert(
                '請填寫細項名稱，例如：火車、船票、午餐'
            );

            return;
        }


        if (isNaN(amount) || amount <= 0) {

            alert('請輸入有效的金額');

            return;
        }


        const plan =
            state.plannedExpenses.find(
                p => p.id === planId
            );


        if (plan) {

            if (!plan.items) {
                plan.items = [];
            }


            plan.items.push({

                id: Date.now(),

                name,

                amount,

                category

            });


            plan.amount =
                getPlanTotalAmount(plan);


            saveState();

            render();
        }
    }


    /* =========================================================
       刪除活動細項
       ========================================================= */

    function deleteSubItem(planId, itemId) {

        const plan =
            state.plannedExpenses.find(
                p => p.id === planId
            );


        if (plan && plan.items) {

            plan.items =
                plan.items.filter(
                    i => i.id !== itemId
                );

            plan.amount =
                getPlanTotalAmount(plan);


            saveState();

            render();
        }
    }


    /* =========================================================
       展開 / 收合活動
       ========================================================= */

    function togglePlanExpand(planId) {

        const plan =
            state.plannedExpenses.find(
                p => p.id === planId
            );


        if (plan) {

            plan.expanded =
                !plan.expanded;

            saveState();

            render();
        }
    }


    /* =========================================================
       刪除活動
       ========================================================= */

    function deletePlannedExpense(id) {

        state.plannedExpenses =
            state.plannedExpenses.filter(
                p => p.id !== id
            );

        saveState();

        render();
    }


    /* =========================================================
       活動完成
       ========================================================= */

    function completePlannedExpense(id) {

        const plan =
            state.plannedExpenses.find(
                p => p.id === id
            );

        if (!plan) return;

        plan.completed = true;

        saveState();

        render();
    }


    /* =========================================================
       存款
       ========================================================= */

    function addSavingsRecord() {

        const action =
            document.getElementById(
                'savingsAction'
            ).value;

        const amount =
            parseFloat(
                document.getElementById(
                    'savingsAmount'
                ).value
            );

        const category =
            document.getElementById(
                'savingsCategory'
            ).value;

        const note =
            document.getElementById(
                'savingsNote'
            ).value.trim();


        if (isNaN(amount) || amount <= 0) {

            alert('請輸入有效的存款金額！');

            return;
        }


        if (
            action === 'withdraw' &&
            amount > state.totalSavings
        ) {

            alert(
                '提取金額不能大於目前累積存款總額！'
            );

            return;
        }


        const changeAmount =
            action === 'deposit'
                ? amount
                : -amount;


        state.totalSavings += changeAmount;


        state.savingsRecords.push({

            id: Date.now(),

            date: getTodayStr(),

            category,

            note,

            amount: changeAmount

        });


        saveState();


        document.getElementById(
            'savingsAmount'
        ).value = '';

        document.getElementById(
            'savingsNote'
        ).value = '';


        alert(
            action === 'deposit'
                ? '✅ 成功存入資金！'
                : '✅ 成功提取資金！'
        );


        render();
    }


    /* =========================================================
       自動將本週剩餘存入
       ========================================================= */

    function settlePreviousWeek() {

        const currentWeekKey =
            getWeekKey();

        const weeklyTarget =
            getWeeklyTarget();


        /*
         * 找出目前是否已經結算
         */
        if (
            state.settledWeeks.includes(
                currentWeekKey
            )
        ) {
            return;
        }


        /*
         * 這裡不直接把「本週」結算，
         * 避免使用者今天還在消費。
         *
         * 只會在跨週後處理上一週。
         */
        const now =
            new Date();

        const previousDate =
            new Date(now);

        previousDate.setDate(
            now.getDate() - 7
        );


        const previousWeekKey =
            getWeekKey(previousDate);


        if (
            state.settledWeeks.includes(
                previousWeekKey
            )
        ) {
            return;
        }


        /*
         * 找出上一週實際支出
         */
        const previousRange =
            getWeekRange(previousDate);


        const spent =
            state.transactions
                .filter(t => {

                    const d =
                        new Date(t.date);

                    return (
                        t.type === 'weekly' &&
                        d >= previousRange.monday &&
                        d <= previousRange.sunday
                    );
                })
                .reduce(
                    (sum, t) =>
                        sum + Number(t.amount || 0),
                    0
                );


        /*
         * 上週未使用金額
         */
        const leftover =
            Math.max(
                0,
                weeklyTarget - spent
            );


        /*
         * 有剩才自動存入
         */
        if (leftover > 0) {

            state.totalSavings += leftover;


            state.savingsRecords.push({

                id: Date.now(),

                date: getTodayStr(),

                category: '✨ 週預算結算',

                note:
                    `${previousRange.monday.getMonth() + 1}/${previousRange.monday.getDate()}-${previousRange.sunday.getMonth() + 1}/${previousRange.sunday.getDate()} 週預算結餘`,

                amount: leftover

            });
        }


        state.settledWeeks.push(
            previousWeekKey
        );


        saveState();
    }


    /* =========================================================
       未來出遊監控
       ========================================================= */

    function renderTodayPlanMonitor() {

        const monitor =
            document.getElementById(
                'todayPlanMonitor'
            );

        const list =
            document.getElementById(
                'todayPlanList'
            );

        const dateText =
            document.getElementById(
                'todayPlanDate'
            );


        if (!monitor || !list) return;


        const todayPlans =
            state.plannedExpenses.filter(
                p =>
                    p.date === getTodayStr() &&
                    !p.completed
            );


        if (todayPlans.length === 0) {

            monitor.style.display = 'none';

            return;
        }


        monitor.style.display = 'block';


        dateText.innerText =
            getTodayStr();


        list.innerHTML = '';


        todayPlans.forEach(plan => {

            const total =
                getPlanTotalAmount(plan);

            const actual =
                getPlanActualSpent(plan);

            const remaining =
                total - actual;


            const isOver =
                remaining < 0;


            const planDiv =
                document.createElement('div');

            planDiv.className =
                'today-plan-item';


            let itemsHtml = '';


            if (
                plan.items &&
                plan.items.length > 0
            ) {

                itemsHtml =
                    plan.items.map(item => {

                        const planned =
                            Number(item.amount || 0);

                        const actualItem =
                            getPlanItemActualSpent(
                                plan,
                                item
                            );

                        const itemRemaining =
                            planned - actualItem;

                        const over =
                            itemRemaining < 0;


                        return `
                            <div style="padding:8px 0; border-bottom:0.5px solid #eee;">
                                <div class="item-title">
                                    <span>
                                        ${item.category || '📦 其他'}
                                        ${item.name}
                                    </span>

                                    <span>
                                        NT$ ${planned.toLocaleString()}
                                    </span>
                                </div>

                                <div class="item-status">
                                    <span>
                                        已花 NT$ ${actualItem.toLocaleString()}
                                    </span>

                                    <span
                                        class="status-badge ${over ? 'over' : 'ok'}"
                                    >
                                        ${
                                            over
                                                ? `超支 NT$ ${Math.abs(itemRemaining).toLocaleString()}`
                                                : `剩 NT$ ${itemRemaining.toLocaleString()}`
                                        }
                                    </span>
                                </div>
                            </div>
                        `;

                    }).join('');
            }


            planDiv.innerHTML = `

                <div class="item-title">

                    <span>
                        🗓️ ${plan.title}
                    </span>

                    <span>
                        NT$ ${total.toLocaleString()}
                    </span>

                </div>

                ${itemsHtml}

                <div style="
                    margin-top:10px;
                    padding-top:10px;
                    border-top:1px solid #eee;
                    display:flex;
                    justify-content:space-between;
                    font-weight:600;
                ">

                    <span>
                        ${isOver ? '🚨 活動超支' : '💰 活動剩餘'}
                    </span>

                    <span
                        style="
                            color:${isOver ? 'var(--danger)' : 'var(--success)'};
                        "
                    >
                        ${
                            isOver
                                ? `超支 NT$ ${Math.abs(remaining).toLocaleString()}`
                                : `NT$ ${remaining.toLocaleString()}`
                        }
                    </span>

                </div>
            `;


            list.appendChild(planDiv);
        });
    }


    /* =========================================================
       未來出遊總覽
       ========================================================= */

    function getFutureTripAnalysis() {

        const futurePlans =
            getFuturePlans();

        const monthlyFutureTotal =
            futurePlans
                .filter(p =>
                    isSameMonth(p.date)
                )
                .reduce(
                    (sum, p) =>
                        sum + getPlanTotalAmount(p),
                    0
                );


        const monthlySpent =
            state.transactions
                .filter(t =>
                    t.type === 'weekly' &&
                    isSameMonth(t.date)
                )
                .reduce(
                    (sum, t) =>
                        sum + Number(t.amount || 0),
                    0
                );


        const monthlyBudget =
            WEEKLY_AVAILABLE;


        const monthlyRemainingBeforePlans =
            Math.max(
                0,
                monthlyBudget - monthlySpent
            );


        const afterFutureTrips =
            monthlyRemainingBeforePlans -
            monthlyFutureTotal;


        return {

            futurePlans,

            monthlyFutureTotal,

            monthlySpent,

            monthlyBudget,

            monthlyRemainingBeforePlans,

            afterFutureTrips

        };
    }


    /* =========================================================
       AI 預算建議
       ========================================================= */

    function generateAiAdvice(
        remaining,
        daysLeft,
        dailyBudget,
        percent,
        weeklySpent,
        cashTotal,
        cardTotal,
        categories,
        plannedReserved
    ) {

        let homeAdvice = '';


        /* -----------------------------------------------------
           目前每週預算
           ----------------------------------------------------- */

        if (remaining <= 0) {

            homeAdvice +=
                '🚨 本週日常預算已用完，接下來建議暫停非必要消費。<br>';

        } else if (dailyBudget < 200) {

            homeAdvice +=
                `⚠️ 本週剩餘 NT$ ${remaining.toLocaleString()}，剩 ${daysLeft} 天，建議每天控制在 NT$ ${dailyBudget.toLocaleString()} 以內。<br>`;

        } else if (percent > 70) {

            homeAdvice +=
                `💡 本週已使用 ${percent}% 預算，目前每日建議控制在 NT$ ${dailyBudget.toLocaleString()}。<br>`;

        } else {

            homeAdvice +=
                `🟢 本週預算控制良好，目前每日約可使用 NT$ ${dailyBudget.toLocaleString()}。<br>`;
        }


        /* -----------------------------------------------------
           未來出遊 / 活動分析
           ----------------------------------------------------- */

        const trip =
            getFutureTripAnalysis();


        if (
            trip.futurePlans.length > 0
        ) {

            const futureAmount =
                trip.monthlyFutureTotal;


            const percentage =
                Math.round(
                    (
                        futureAmount /
                        trip.monthlyBudget
                    ) * 100
                );


            homeAdvice +=
                `🗓️ 本月目前已規劃未來活動 NT$ ${futureAmount.toLocaleString()}，約占本月可分配預算 ${percentage}%。<br>`;


            /*
             * 如果未來活動已經壓縮到月預算
             */
            if (
                trip.afterFutureTrips < 0
            ) {

                homeAdvice +=
                    `🚨 未來活動預算超過目前可分配額度 NT$ ${Math.abs(trip.afterFutureTrips).toLocaleString()}，建議降低活動預算，或在其他週降低日常支出。<br>`;

            } else {

                homeAdvice +=
                    `💰 扣除目前已規劃活動後，本月預估還有 NT$ ${trip.afterFutureTrips.toLocaleString()} 可供一般生活支出。<br>`;
            }


            /*
             * 找最近一場活動
             */
            const nextPlan =
                trip.futurePlans[0];


            if (nextPlan) {

                const nextAmount =
                    getPlanTotalAmount(nextPlan);


                const daysUntil =
                    Math.ceil(
                        (
                            new Date(nextPlan.date) -
                            new Date(getTodayStr())
                        ) /
                        (1000 * 60 * 60 * 24)
                    );


                if (daysUntil >= 0) {

                    homeAdvice +=
                        `📌 最近的活動是「${nextPlan.title}」，預計 ${nextPlan.date} 使用 NT$ ${nextAmount.toLocaleString()}。`;


                    if (daysUntil > 0) {

                        const savePerDay =
                            Math.ceil(
                                nextAmount /
                                daysUntil
                            );

                        homeAdvice +=
                            `距離活動還有 ${daysUntil} 天，可以每天預留約 NT$ ${savePerDay.toLocaleString()} 的空間。`;
                    }

                    homeAdvice += '<br>';
                }
            }
        }


        /*
         * 如果本週有特別支出
         */
        if (plannedReserved > 0) {

            homeAdvice +=
                `🗓️ 本週已預留 NT$ ${plannedReserved.toLocaleString()} 的特別支出，這筆金額已從本週自由預算扣除。<br>`;
        }


        /*
         * 月度調配建議
         */
        if (
            trip.monthlyFutureTotal > 0 &&
            trip.afterFutureTrips >= 0
        ) {

            const remainingWeeks =
                Math.max(
                    1,
                    getWeeksInMonth()
                );


            const recommendedWeekly =
                Math.floor(
                    trip.afterFutureTrips /
                    remainingWeeks
                );


            homeAdvice +=
                `📊 月度調配建議：若希望保留目前規劃的出遊預算，接下來每週一般支出平均控制在約 NT$ ${recommendedWeekly.toLocaleString()} 會比較安全。`;
        }


        document.getElementById(
            'aiHomeAdvice'
        ).innerHTML = homeAdvice;


        /* -----------------------------------------------------
           分析頁 AI
           ----------------------------------------------------- */

        let topCategory = '無';

        let topAmount = 0;


        for (let cat in categories) {

            if (
                categories[cat] >
                topAmount
            ) {

                topAmount =
                    categories[cat];

                topCategory =
                    cat;
            }
        }


        let analyticsAdvice =
            `• 本週最大開支為 <b>${topCategory}</b>（共 NT$ ${topAmount.toLocaleString()}）。<br>`;


        if (
            trip.monthlyFutureTotal > 0
        ) {

            analyticsAdvice +=
                `• 本月未來活動目前已規劃 NT$ ${trip.monthlyFutureTotal.toLocaleString()}。<br>`;

            if (
                trip.afterFutureTrips < 0
            ) {

                analyticsAdvice +=
                    `• 🚨 未來活動預算已超過本月剩餘可分配額度 NT$ ${Math.abs(trip.afterFutureTrips).toLocaleString()}，建議調整活動預算。<br>`;

            } else {

                analyticsAdvice +=
                    `• 🟢 扣除未來活動後，本月預估仍有 NT$ ${trip.afterFutureTrips.toLocaleString()} 可用。<br>`;
            }
        }


        if (
            cardTotal >
            cashTotal
        ) {

            analyticsAdvice +=
                `• 本週偏向使用 💳 信用卡支付，占 ${Math.round((cardTotal / (cashTotal + cardTotal || 1)) * 100)}%，月底請留意帳單。`;

        } else if (
            cashTotal > 0
        ) {

            analyticsAdvice +=
                `• 本週主要使用 💵 現金支付。`;
        }


        document.getElementById(
            'aiAnalyticsAdvice'
        ).innerHTML =
            analyticsAdvice;
    }


    /* =========================================================
       日曆
       ========================================================= */

    function renderCalendar() {

        const calendarGrid =
            document.getElementById(
                'calendarGrid'
            );

        calendarGrid.innerHTML = '';


        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            now.getMonth();


        document.getElementById(
            'calMonthTitle'
        ).innerText =
            `${year}年 ${month + 1}月`;


        const days =
            ['日', '一', '二', '三', '四', '五', '六'];


        days.forEach(d => {

            const head =
                document.createElement(
                    'div'
                );

            head.className =
                'cal-day-head';

            head.innerText =
                d;

            calendarGrid.appendChild(
                head
            );
        });


        const firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();


        const totalDays =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            calendarGrid.appendChild(
                document.createElement('div')
            );
        }


        for (
            let day = 1;
            day <= totalDays;
            day++
        ) {

            const dateStr =
                `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;


            const dayDiv =
                document.createElement(
                    'div'
                );


            dayDiv.className =
                'cal-day';


            if (
                dateStr === todayStr
            ) {

                dayDiv.classList.add(
                    'today'
                );
            }


            if (
                dateStr === selectedCalDate
            ) {

                dayDiv.classList.add(
                    'active-day'
                );
            }


            dayDiv.innerText =
                day;


            const hasTx =
                state.transactions.some(
                    t =>
                        t.date === dateStr
                );


            const hasPlan =
                state.plannedExpenses.some(
                    p =>
                        p.date === dateStr
                );


            if (hasTx) {

                const dot =
                    document.createElement(
                        'div'
                    );

                dot.className =
                    'cal-dot';

                dayDiv.appendChild(
                    dot
                );

            } else if (hasPlan) {

                const dot =
                    document.createElement(
                        'div'
                    );

                dot.className =
                    'cal-dot planned';

                dayDiv.appendChild(
                    dot
                );
            }


            dayDiv.onclick = () => {

                selectedCalDate =
                    dateStr;

                renderCalendar();

                renderCalendarDayDetails(
                    dateStr
                );
            };


            calendarGrid.appendChild(
                dayDiv
            );
        }


        renderCalendarDayDetails(
            selectedCalDate
        );
    }


    /* =========================================================
       日曆明細
       ========================================================= */

    function renderCalendarDayDetails(dateStr) {

        document.getElementById(
            'selectedDateTitle'
        ).innerText =
            `${dateStr} 明細與規劃`;


        const list =
            document.getElementById(
                'calendarDayTxList'
            );

        list.innerHTML = '';


        const txs =
            state.transactions.filter(
                t =>
                    t.date === dateStr
            );


        const plans =
            state.plannedExpenses.filter(
                p =>
                    p.date === dateStr
            );


        if (
            txs.length === 0 &&
            plans.length === 0
        ) {

            list.innerHTML =
                '<div style="font-size:13px; color:var(--sub); padding:10px 0;">當日無支出或預期規劃</div>';

            return;
        }


        /* 未來活動 */
        plans.forEach(p => {

            const totalAmt =
                getPlanTotalAmount(p);

            const actual =
                getPlanActualSpent(p);

            const remaining =
                totalAmt - actual;


            const item =
                document.createElement(
                    'div'
                );


            item.className =
                'tx-item';


            item.style.background =
                '#fffcf5';

            item.style.padding =
                '10px 12px';

            item.style.borderRadius =
                '12px';

            item.style.marginBottom =
                '8px';


            let subDetailsHtml = '';


            if (
                p.items &&
                p.items.length > 0
            ) {

                subDetailsHtml =
                    p.items.map(i => {

                        const actualItem =
                            getPlanItemActualSpent(
                                p,
                                i
                            );

                        const left =
                            Number(i.amount) -
                            actualItem;


                        return `
                            <div style="font-size:11px; color:var(--sub); margin-top:5px; display:flex; justify-content:space-between;">
                                <span>
                                    ${i.category || '📦 其他'}
                                    ${i.name}
                                </span>

                                <span style="font-weight:600; color:${left < 0 ? 'var(--danger)' : 'var(--success)'};">
                                    ${
                                        left < 0
                                            ? `超支 NT$ ${Math.abs(left).toLocaleString()}`
                                            : `剩 NT$ ${left.toLocaleString()}`
                                    }
                                </span>
                            </div>
                        `;

                    }).join('');
            }


            item.innerHTML = `

                <div style="flex:1;">

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    ">

                        <div style="
                            font-weight:600;
                            font-size:14px;
                            color:var(--warning);
                        ">
                            🗓️ ${p.title}
                        </div>

                        <div style="
                            font-weight:600;
                            color:${remaining < 0 ? 'var(--danger)' : 'var(--warning)'};
                        ">
                            ${
                                remaining < 0
                                    ? `超支 NT$ ${Math.abs(remaining).toLocaleString()}`
                                    : `剩 NT$ ${remaining.toLocaleString()}`
                            }
                        </div>

                    </div>

                    <div style="
                        font-size:11px;
                        color:var(--sub);
                        margin-top:4px;
                    ">
                        活動預算 NT$ ${totalAmt.toLocaleString()}
                        · 已花 NT$ ${actual.toLocaleString()}
                    </div>

                    ${subDetailsHtml}

                </div>
            `;


            list.appendChild(item);
        });


        /* 實際支出 */
        let total = 0;


        txs.forEach(t => {

            total +=
                Number(t.amount || 0);


            const paymentLabel =
                t.payment ||
                '💵 現金';


            const item =
                document.createElement(
                    'div'
                );


            item.className =
                'tx-item';


            item.innerHTML = `

                <div style="
                    display:flex;
                    align-items:center;
                ">

                    <div class="tx-icon">
                        ${t.category.split(' ')[0]}
                    </div>

                    <div>

                        <div style="
                            font-weight:600;
                            font-size:14px;
                        ">
                            ${t.note || t.category}
                        </div>

                        <div style="
                            font-size:11px;
                            color:var(--sub);
                            margin-top:1px;
                        ">
                            ${paymentLabel}
                            ·
                            ${t.type === 'reserve'
                                ? '🛟 預備金'
                                : '日常預算'}
                        </div>

                    </div>

                </div>

                <div style="
                    font-weight:600;
                    color:var(--danger);
                    font-variant-numeric:tabular-nums;
                ">
                    -NT$ ${t.amount.toLocaleString()}
                </div>

            `;


            list.appendChild(item);
        });


        if (txs.length > 0) {

            const sumDiv =
                document.createElement(
                    'div'
                );


            sumDiv.style.cssText =
                `
                    text-align:right;
                    font-weight:600;
                    font-size:14px;
                    margin-top:12px;
                    color:var(--text);
                    font-variant-numeric:tabular-nums;
                `;


            sumDiv.innerText =
                `當日實際總計：NT$ ${total.toLocaleString()}`;


            list.appendChild(
                sumDiv
            );
        }
    }


    /* =========================================================
       主要 Render
       ========================================================= */

    function render() {

        /*
         * 跨週時，自動把上一週剩餘存入
         */
        settlePreviousWeek();


        const weeklyTarget =
            getWeeklyTarget();


        const weeklySpent =
            getWeeklySpent();


        const plannedReserved =
            getWeeklyPlannedReserved();


        /*
         * 本週真正可自由支配金額
         */
        const remaining =
            weeklyTarget -
            weeklySpent -
            plannedReserved;


        const percent =
            Math.min(
                100,
                Math.round(
                    (
                        (
                            weeklySpent +
                            plannedReserved
                        ) /
                        weeklyTarget
                    ) * 100
                )
            );


        /* -----------------------------------------------------
           首頁週預算
           ----------------------------------------------------- */

        document.getElementById(
            'weekRangeText'
        ).innerText =
            getWeekRangeText();


        document.getElementById(
            'weeklyCalcTag'
        ).innerText =
            `本月包含 ${getWeeksInMonth()} 週（每週約 NT$ ${weeklyTarget.toLocaleString()}）`;


        document.getElementById(
            'weeklyTarget'
        ).innerText =
            `NT$ ${weeklyTarget.toLocaleString()}`;


        document.getElementById(
            'weeklyRemaining'
        ).innerText =
            `NT$ ${Math.max(0, remaining).toLocaleString()}`;


        document.getElementById(
            'weeklySpent'
        ).innerText =
            `NT$ ${weeklySpent.toLocaleString()}`;


        document.getElementById(
            'progressFill'
        ).style.width =
            `${percent}%`;


        document.getElementById(
            'percentText'
        ).innerText =
            `${percent}%`;


        /* -----------------------------------------------------
           本週特別支出
           ----------------------------------------------------- */

        const reservedNoticeArea =
            document.getElementById(
                'reservedNoticeArea'
            );


        if (
            plannedReserved > 0
        ) {

            reservedNoticeArea.style.display =
                'block';


            document.getElementById(
                'totalReservedAmount'
            ).innerText =
                `NT$ ${plannedReserved.toLocaleString()}`;

        } else {

            reservedNoticeArea.style.display =
                'none';
        }


        /* -----------------------------------------------------
           剩餘天數
           ----------------------------------------------------- */

        const now =
            new Date();


        const dayOfWeek =
            now.getDay() === 0
                ? 7
                : now.getDay();


        const daysLeft =
            8 - dayOfWeek;


        document.getElementById(
            'daysLeft'
        ).innerText =
            `${daysLeft} 天`;


        const dailyBudget =
            daysLeft > 0
                ? Math.max(

                        daysLeft

        document.getElementById(
            'dailyBudget'

            'reserveRemaining'

                                        style="
                                            flex:2;
                                            padding:8px 10px;
                                            font-size:13px;
                                        "
                                    >


                                    <input
                                        type="number"
                                        id="subAmount_${p.id}"
                                        placeholder="金額"
                                        inputmode="decimal"
                                        style="
                                            flex:1.5;
                                            padding:8px 10px;
                                            font-size:13px;
                                        "
                                    >


                                    <button
                                        onclick="addSubItem(${p.id})"
                                        style="
                                            background:var(--primary);
                                            color:white;
                                            border:none;
                                            border-radius:10px;
                                            padding:0 12px;
                                            font-weight:600;
                                            font-size:13px;
                                            cursor:pointer;
                                        "
                                    >
                                        新增
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;


                    plannedExpenseList.appendChild(
                        planCard
                    );
                });
        }


        /* -----------------------------------------------------
           存款紀錄
           ----------------------------------------------------- */

        const savingsHistory =
            document.getElementById(
                'savingsHistory'
            );


        savingsHistory.innerHTML = '';


        if (
            !state.savingsRecords ||
            state.savingsRecords.length === 0
        ) {

            savingsHistory.innerHTML =
                `
                    <div style="
                        font-size:13px;
                        color:var(--sub);
                        padding:10px 0;
                    ">
                        尚無存款紀錄
                    </div>
                `;

        } else {

            state.savingsRecords
                .slice()
                .reverse()
                .forEach(s => {

                    const isPositive =
                        s.amount > 0;


                    const item =
                        document.createElement(
                            'div'
                        );


                    item.className =
                        'tx-item';


                    item.innerHTML = `

                        <div style="
                            display:flex;
                            align-items:center;
                        ">

                            <div class="tx-icon">
                                ${isPositive ? '💰' : '🛒'}
                            </div>

                            <div>

                                <div style="
                                    font-weight:600;
                                    font-size:14px;
                                ">
                                    ${s.note || s.category}
                                </div>

                                <div style="
                                    font-size:11px;
                                    color:var(--sub);
                                    margin-top:1px;
                                ">
                                    ${s.date}
                                    ·
                                    ${s.category}
                                </div>

                            </div>

                        </div>


                        <div style="
                            font-weight:600;
                            color:${isPositive ? 'var(--success)' : 'var(--danger)'};
                            font-variant-numeric:tabular-nums;
                        ">
                            ${isPositive ? '+' : ''}
                            NT$ ${s.amount.toLocaleString()}
                        </div>

                    `;


                    savingsHistory.appendChild(
                        item
                    );
                });
        }


        /* -----------------------------------------------------
           分析統計
           ----------------------------------------------------- */

        let cashTotal = 0;

        let cardTotal = 0;

        const categories = {};


        state.transactions.forEach(t => {

            const pay =
                t.payment ||
                '💵 現金';


            if (
                pay.includes('現金')
            ) {

                cashTotal +=
                    Number(t.amount || 0);
            }


            if (
                pay.includes('信用卡')
            ) {

                cardTotal +=
                    Number(t.amount || 0);
            }


            categories[t.category] =
                (
                    categories[t.category] ||
                    0
                ) +
                Number(t.amount || 0);
        });


        document.getElementById(
            'totalCashSpent'
        ).innerText =
            `NT$ ${cashTotal.toLocaleString()}`;


        document.getElementById(
            'totalCardSpent'
        ).innerText =
            `NT$ ${cardTotal.toLocaleString()}`;


        const analyticsList =
            document.getElementById(
                'categoryAnalysis'
            );


        analyticsList.innerHTML = '';


        for (
            let cat in categories
        ) {

            const div =
                document.createElement(
                    'div'
                );


            div.className =
                'tx-item';


            div.innerHTML = `

                <div style="
                    font-weight:500;
                ">
                    ${cat}
                </div>

                <div style="
                    font-weight:600;
                    font-variant-numeric:tabular-nums;
                ">
                    NT$ ${categories[cat].toLocaleString()}
                </div>

            `;


            analyticsList.appendChild(
                div
            );
        }


        /* -----------------------------------------------------
           AI
           ----------------------------------------------------- */

        generateAiAdvice(

            remaining,

            daysLeft,

            dailyBudget,

            percent,

            weeklySpent,

            cashTotal,

            cardTotal,

            categories,

            plannedReserved

        );


        /* -----------------------------------------------------
           日曆
           ----------------------------------------------------- */

        renderCalendar();
    }


    /* =========================================================
       匯出資料
       ========================================================= */

    function exportData() {

        const dataStr =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(
                JSON.stringify(
                    state,
                    null,
                    2
                )
            );


        const downloadAnchor =
            document.createElement(
                'a'
            );


        const dateStr =
            getTodayStr();


        downloadAnchor.setAttribute(
            "href",
            dataStr
        );


        downloadAnchor.setAttribute(
            "download",
            `週週存_備份檔_${dateStr}.json`
        );


        document.body.appendChild(
            downloadAnchor
        );


        downloadAnchor.click();

        downloadAnchor.remove();
    }


    /* =========================================================
       匯入資料
       ========================================================= */

    function importData(event) {

        const file =
            event.target.files[0];


        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                try {

                    const importedState =
                        JSON.parse(
                            e.target.result
                        );


                    if (
                        importedState &&
                        Array.isArray(
                            importedState.transactions
                        )
                    ) {

                        state =
                            importedState;


                        if (
                            !state.savingsRecords
                        ) {
                            state.savingsRecords = [];
                        }


                        if (
                            !state.plannedExpenses
                        ) {
                            state.plannedExpenses = [];
                        }


                        if (
                            !state.settledWeeks
                        ) {
                            state.settledWeeks = [];
                        }


                        state.plannedExpenses
                            .forEach(p => {

                                if (!p.items) {
                                    p.items = [];
                                }

                                if (
                                    p.expanded === undefined
                                ) {
                                    p.expanded = false;
                                }

                                p.items.forEach(item => {

                                    if (!item.category) {

                                        item.category =
                                            guessPlanCategory(
                                                item.name
                                            );
                                    }
                                });
                            });


                        saveState();


                        alert(
                            '✅ 資料還原成功！'
                        );


                        render();


                        switchPage(
                            'home',
                            document.querySelectorAll(
                                '.nav-item'
                            )[0]
                        );

                    } else {

                        alert(
                            '❌ 備份檔案格式不正確！'
                        );
                    }

                } catch (err) {

                    alert(
                        '❌ 解析備份檔案失敗！'
                    );
                }
            };


        reader.readAsText(file);
    }


    /* =========================================================
       清空資料
       ========================================================= */

    function clearAllData() {

        if (
            confirm(
                '確定要清空所有記帳資料嗎？此操作不可逆！'
            )
        ) {

            state = {

                transactions: [],

                plannedExpenses: [],

                savingsRecords: [],

                totalSavings: 0,

                reserveSpent: 0,

                settledWeeks: []

            };


            saveState();


            alert(
                '已清空所有資料！'
            );


            render();
        }
    }


    /* =========================================================
       啟動
       ========================================================= */

    render();

</script>
